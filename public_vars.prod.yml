main_domain: "nocost.site"
public_services:
    - flarum
    - mediawiki
    - wordpress

python_version: "3.14"
php_version: "8.4"
mariadb_version: "12.1"

ufw_allowed_ports:
    - 22
    - 80
    - 443
    - 25
    - 587

skeletons_pub:
    mediawiki_major: "1.44"
    mediawiki_version: "1.44.0"

paths:
    backend_root: /srv/nocost/backend
    backend_bin_root: /srv/nocost/backend/bin
    frontend_root: /srv/nocost/frontend
    backup_root: /backup
    backup_host_root: /backup/host
    backup_attic_root: /backup/attic

    tenants:
        root: /srv/host
        skeleton_root: /srv/skeleton
        flarum_skeleton: "{{ paths.tenants.skeleton_root }}/flarum"
        mediawiki_skeleton: "{{ paths.tenants.skeleton_root }}/mediawiki"
        wordpress_skeleton: "{{ paths.tenants.skeleton_root }}/wordpress"
