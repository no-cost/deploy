main_domain: "no-cost.site"
public_services:
    - flarum
    - mediawiki
    - wordpress

python_version: "3.14"
php_version: "8.5"
mariadb_version: "11.8" # MW is not compat with 12.x: https://phabricator.wikimedia.org/T401570

ufw_allowed_ports:
    - 22
    - 80
    - 443
    - 25
    - 587

skeletons_pub:
    mediawiki_version: "1.45.1"

paths:
    backend_root: /srv/nocost/backend
    backend_bin_root: /srv/nocost/backend/.venv/bin
    frontend_root: /srv/nocost/frontend
    backup_root: /backup
    backup_host_root: /backup/host
    backup_attic_root: /backup/attic

    tenants:
        root: /srv/host
        skeleton_root: /srv/skeleton
        flarum_skeleton: "{{ paths.tenants.skeleton_root }}/flarum"
        mediawiki_skeleton: "{{ paths.tenants.skeleton_root }}/mediawiki"
        wordpress_skeleton: "{{ paths.tenants.skeleton_root }}/wordpress"
