- name: Fix permissions for /root/.ssh/
  # The permissions tend to mess up after copying files over SFTP from old server
  ansible.builtin.file:
    path: /root/.ssh/
    owner: root
    group: root
    mode: "600"
    recurse: true


- name: Install SSH keys
  ansible.posix.authorized_key:
    user: root
    key: '{{ item }}'
  loop:
    - "ssh-rsa  kevin"

- name: Enforce UTC
  community.general.timezone:
    name: UTC

- name: Enforce UTF8 locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: "LANG=C.UTF-8\n"
    mode: "0644"


- name: Install root bashrc
  ansible.builtin.copy:
    src: files/root/bashrc
    dest: /root/.bashrc
    mode: "0644"
