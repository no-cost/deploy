# Logwatch configuration file

# Output type (mail, stdout, file)
Output = mail

# Format of output (text, html)
Format = text

# Email recipient for reports
MailTo = {{ postfix.forward_mail_to }}

# Email sender address
MailFrom = system@{{ main_domain }}

# Date range for the report
# Options: Yesterday, Today, All
# For weekly reports, we'll use All and rely on cron scheduling
Range = All

# Detail level (Low, Med, High, 0-10)
Detail = Med

# Services to monitor (All = all services)
Service = All

# Log directory
LogDir = /var/log

# Archive directory (for rotated logs)
Archives = Yes

# Print the log file name with the log message
PrintService = Yes

# Show detail for each host/service
HostLimit = Yes
