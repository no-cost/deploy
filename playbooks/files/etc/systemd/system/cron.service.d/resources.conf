[Service]
# Cron jobs run in this unit's cgroup, PHP-FPM, MariaDB and nginx in their own (CPUWeight 100). The CPU is shared
# by cgroup weight first, so the jobs' nice 19 doesn't help against PHP-FPM, whose workers have nice 19 too: on
# FreeFlarum (the same setup) the nightly site backup (4 sites at a time, ~4 cores) kept the CPU at ~95 % and requests
# got slower until they reached process.max (php-fpm.conf). With 10 the jobs get what PHP-FPM, MariaDB and nginx leave,
# and still ~5 % of the CPU when everything is busy.
CPUWeight=10

# The jobs' page cache counts here too (the nightly site backup reads every site's files). Above MemoryHigh the kernel
# reclaims the jobs' own memory (their cache) and slows them, instead of evicting the cached code and files of PHP-FPM,
# MariaDB and nginx: on FreeFlarum RAM went above 90 % during the backup and the server thrashed until the morning
# (21 Nov 2026). MemoryMax OOM-kills a job, and OOMPolicy=continue keeps cron running then (systemd's default stops
# the unit, with every job in it).
MemoryHigh=10%
MemoryMax=20%
OOMPolicy=continue
