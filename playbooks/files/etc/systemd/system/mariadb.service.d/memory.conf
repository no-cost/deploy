[Service]
# jemalloc instead of glibc malloc: with glibc, mariadbd kept ~3.2 GB in 92 per-thread malloc arenas
# (fragmentation) next to its 3.9 GB buffer pool, and the kernel OOM killer picked it during the migration
Environment=LD_PRELOAD=/usr/lib/{{ ansible_architecture }}-linux-gnu/libjemalloc.so.2

# the OOM killer picks MariaDB last: a killed PHP worker fails one request, a killed MariaDB every site
OOMScoreAdjust=-800
