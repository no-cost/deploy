[Service]
# a worker killed by the kernel OOM killer must not stop the service: systemd's default (OOMPolicy=stop)
# stopped PHP-FPM, every site answered 502 until all pools were started again (~3 min with thousands of pools)
OOMPolicy=continue

# PHP-FPM workers get OOM-killed inside this limit before the kernel runs out of memory and picks
# other services (MariaDB, see mariadb.service.d/memory.conf). MariaDB settles at ~40 % of RAM (25 % buffer pool
# plus caches), the system and the other services need ~15 %: with 50 % here, a burst of workers (e.g. every
# site recompiling after a reload) filled the whole RAM before this limit was reached, and without swap the
# server stalled instead of killing a worker.
MemoryMax={{ (ansible_memtotal_mb * 0.4) | int }}M
