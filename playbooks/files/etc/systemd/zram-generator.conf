# Compressed swap in RAM (zram, zstd ~3:1). Without swap the kernel can only evict cached files (the code of PHP-FPM,
# MariaDB and nginx, the sites' files) and read them back, while idle anonymous memory (idle workers, MariaDB's unused
# allocations) stays in RAM: on FreeFlarum (the same setup, 21 Nov 2026) the server thrashed for over 8 hours (tasks
# stalled on memory 85 % of the time, 52 MB/s of disk reads) and the OOM killer only killed spamd. zram needs no disk
# space or disk I/O. vm.swappiness and vm.page-cluster for zram: 01-base-system.yml.
# A change applies at boot or with `systemctl restart systemd-zram-setup@zram0` (moves the swapped pages back first).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
