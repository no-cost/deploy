# reject TLS for unknown hosts (direct IP, scanners, etc.)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# http -> https
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# entry point for tenants
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {% for domain in domains.keys() %}*.{{ domain }} {% endfor %};
    include /etc/nginx/snippets/custom-server-names.conf;

    ssl_certificate $ssl_cert_dir/fullchain.pem;
    ssl_certificate_key $ssl_cert_dir/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # reject unknown hosts
    if ($site_id = "") {
        return 404;
    }
    if ($service_type = "") {
        return 404;
    }

    # redirect non-canonical hosts to canonical
    if ($needs_redirect) {
        return 301 https://$canonical_host$request_uri;
    }

    # route to service-specific internal server
    location / {
        proxy_pass http://unix:/run/nginx/tenants_$service_type.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Id $site_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
