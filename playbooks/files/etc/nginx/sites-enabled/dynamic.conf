# http -> https
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# wildcard for internal domains,
# letsencrypt for user domains
map $ssl_server_name $ssl_cert_dir {
{% for domain in domains.keys() %}
    ~^(.+\.)?{{ domain | regex_escape }}$ /etc/ssl/wildcard/{{ domain }};
{% endfor %}
    default /etc/letsencrypt/live/$ssl_server_name;
}

# include site_id -> service_type map
include /etc/nginx/maps/sites.conf;

# entry point for tenants
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate $ssl_cert_dir/fullchain.pem;
    ssl_certificate_key $ssl_cert_dir/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # reject unknown hosts
    if ($site_id = "") {
        return 404;
    }
    if ($service_type = "") {
        return 404;
    }

    # route to service-specific internal server
    location / {
        proxy_pass http://unix:/var/run/nginx/tenant_$service_type.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Id $site_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
