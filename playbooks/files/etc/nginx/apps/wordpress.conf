# https://developer.wordpress.org/advanced-administration/server/web-server/nginx/

server {
    listen unix:/run/tenants_wordpress.sock;
    include /etc/nginx/snippets/tenant-common.conf;

    # resolve real client IP from outer proxy
    set_real_ip_from unix:;
    real_ip_header X-Real-IP;

    # deny access to sensitive files
    location = /wp-config.php {
        return 404;
    }
    location = /xmlrpc.php {
        return 404;
    }
    location ~ ^/wp-includes/(?!js/tinymce/).*\.php$ {
        return 404;
    }
    location ~ ^/wp-content/uploads/.*\.php$ {
        return 404;
    }

    # php handler
    location ~ \.php$ {
        try_files $uri =404;
        # rate-limits.conf: per client; per site its pool's pm.max_children (base-pool.conf) running and as many
        # waiting; all sites together 6 per CPU, at most process.max (php_concurrent_max in public_vars.prod.yml)
        limit_req zone=php_per_ip burst=20 nodelay;
        limit_conn php_per_site 6;
        limit_conn php_all {{ php_concurrent_max }};
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param REMOTE_ADDR $http_x_real_ip;
        fastcgi_param HTTPS on;
        fastcgi_param DOCUMENT_ROOT /public;
        fastcgi_param SCRIPT_FILENAME /public/$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.$site_id.sock;
    }
    location @app {
        rewrite ^ /index.php?$args last;
    }
    location / {
        try_files $uri $uri/ @app;
    }
}
