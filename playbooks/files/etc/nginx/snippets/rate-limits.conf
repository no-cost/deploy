# PHP requests (the php locations in apps/*.conf, static files are nginx's): each takes a PHP-FPM worker (~40 MB) of
# process.max, which all sites share. Above it a request waited in its pool's socket for nginx's 60 s timeout (504)
# while clients and Cloudflare retried: on FreeFlarum (the same setup, 21 Nov 2026) forums answered almost only
# 499/502/504 for over 8 hours, PHP-FPM at process.max, MariaDB out of connections, RAM thrashing. These limits answer
# at once instead: 429 for a client over its rate, 503 for a site or the server at its limit.
limit_req_status 429;
limit_conn_status 503;

# per client: the visitor's IP behind Cloudflare (cloudflare-realip.conf), the TCP peer on custom domains (no
# Cloudflare); bursts of 20, a page view is 1-3 PHP requests (a few more in WordPress's and MediaWiki's admin pages)
limit_req_zone $binary_remote_addr zone=php_per_ip:20m rate=5r/s;
# per site (X-Tenant-Id, set by dynamic.conf): concurrent PHP requests
limit_conn_zone $http_x_tenant_id zone=php_per_site:1m;
# all sites: concurrent PHP requests (one constant key)
map $host $php_all {
    default all;
}
limit_conn_zone $php_all zone=php_all:1m;

# api.{{ main_domain }} (main-site.conf)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
