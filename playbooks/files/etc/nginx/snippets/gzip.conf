gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/xml+rss
  application/rss+xml
  application/atom+xml
  image/svg+xml
  text/x-js
  text/x-cross-domain-policy
  application/x-font-ttf
  application/x-font-opentype
  application/vnd.ms-fontobject
  image/x-icon;
gzip_disable "msie6";
