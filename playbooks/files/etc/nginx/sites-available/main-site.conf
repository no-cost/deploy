server {
    listen 80;
    listen [::]:80;
    server_name freeflarum.com flarum.cloud;

    return 301 https://freeflarum.com$request_uri;
}

map $ssl_server_name $cert_name {
    ~^(.+\.)?freeflarum\.com$ freeflarum.com;
    ~^(.+\.)?flarum\.cloud$    flarum.cloud;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name freeflarum.com *.freeflarum.com flarum.cloud *.flarum.cloud;

    ssl_certificate /etc/ssl/cloudflare/_wildcard.$cert_name.pem;
    ssl_certificate_key /etc/ssl/cloudflare/_wildcard.$cert_name.key;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/main-site.access.log;
    error_log /var/log/nginx/main-site.error.log;

    proxy_pass http://unix:/var/run/uvicorn.sock;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_read_timeout 86400;

    location ~ ^/api {
        limit_req zone=api burst=10 nodelay;
    }

    location / {
        # inherits from parent server block
    }
}
