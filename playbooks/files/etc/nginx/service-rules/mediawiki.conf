# https://www.mediawiki.org/wiki/Manual:Short_URL/Nginx
# https://shorturls.redwerks.org/

# thumbnail 404 handler
location @thumb {
    rewrite ^/images/thumb/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ /thumb.php?f=$1&width=$2 last;
    rewrite ^/images/thumb/archive/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ /thumb.php?f=$1&width=$2&archived=1 last;
}

location @mediawiki {
    # deny access to sensitive directories
    location /cache       { deny all; }
    location /languages   { deny all; }
    location /maintenance { deny all; }
    location /serialized  { deny all; }

    # images: prevent PHP execution, allow thumbnail generation
    location /images {
        add_header X-Content-Type-Options "nosniff";

        # prevent PHP execution in images directory
        location ~ \.php$ {
            return 404;
        }

        # thumbnail handler
        location ~ ^/images/thumb/(archive/)?[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ {
            try_files $uri $uri/ @thumb;
        }
    }
    location /images/deleted {
        deny all;
    }

    # static assets with caching
    location ~ ^/resources/(assets|lib|src) {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }
    location ~ ^/(skins|extensions)/.+\.(css|js|gif|jpg|jpeg|png|svg|wasm|ttf|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }

    # license/credits as plaintext
    location ~ ^/(COPYING|CREDITS)$ {
        default_type text/plain;
    }

    # rest api
    location /rest.php/ {
        try_files $uri $uri/ /rest.php?$query_string;
    }

    # /Page_Name -> index.php?title=Page_Name
    rewrite ^/(.+)$ /index.php?title=$1&$args last;
}
