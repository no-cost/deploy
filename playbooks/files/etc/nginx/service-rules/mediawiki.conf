# https://www.mediawiki.org/wiki/Manual:Short_URL/Nginx

location @mediawiki {
    # entry points
    location ~ ^/(index|load|api|thumb|opensearch_desc|rest|img_auth)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php-fpm.$site_id.sock;
    }

    # static assets
    location /images {
        add_header X-Content-Type-Options "nosniff";
        types { text/plain html htm shtml phtml; }
    }
    location /images/deleted {
        deny all;
    }
    location ~ ^/resources/(assets|lib|src) {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }
    location ~ ^/(skins|extensions)/.+\.(css|js|gif|jpg|jpeg|png|svg|wasm|ttf|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }

    # license/credits as plaintext
    location ~ ^/(COPYING|CREDITS)$ {
        default_type text/plain;
    }

    # rest api
    location /rest.php/ {
        try_files $uri $uri/ /rest.php?$query_string;
    }

    # /Page_Name -> index.php?title=Page_Name
    location / {
        rewrite ^/(.+)$ /index.php?title=$1&$args last;
    }

    # root -> main page
    location = / {
        rewrite ^ /index.php?title=Main_Page last;
    }
}
