# Cloudflare proxies every host of our domains (`domains` in the secrets) except cname.{{ main_domain }} (sites' custom
# domains CNAME to it: Cloudflare refuses a CNAME from another account to a proxied record, "CNAME Cross-User Banned")
# and mail.{{ main_domain }}. Both publish this server's IP, so anyone could send requests for our domains to it directly,
# past Cloudflare's rate limiting and WAF: dynamic.conf and main-site.conf close them without an answer (444). Custom
# domains reach the server directly by design.

# $realip_remote_addr is the TCP peer ($remote_addr is the visitor's IP from CF-Connecting-IP, cloudflare-realip.conf)
geo $realip_remote_addr $trusted_peer {
    default 0;
    # this server (checks run on it)
    127.0.0.0/8 1;
    ::1 1;
    {{ ansible_default_ipv4.address }} 1;
{% if ansible_default_ipv6.address is defined %}
    {{ ansible_default_ipv6.address }} 1;
{% endif %}
{% for ip in cloudflare_ips_v4 + cloudflare_ips_v6 %}
    {{ ip }} 1;
{% endfor %}
}

map $host $own_domain {
    hostnames;
    default 0;
{% for domain in domains.keys() %}
    .{{ domain }} 1;
{% endfor %}
}

map "$own_domain:$trusted_peer" $direct_to_origin {
    "1:0" 1;
    default 0;
}
