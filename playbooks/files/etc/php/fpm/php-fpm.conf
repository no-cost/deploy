[global]
pid = /run/php/php-fpm.pid
error_log = /var/log/php/fpm.log

emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

rlimit_files = 32768

; workers of all pools together: 90 % of PHP-FPM's MemoryMax (php-fpm.service.d/memory.conf) at ~38 MB per worker,
; 147 on 16 GB (php_fpm_process_max in public_vars.prod.yml). Each pool alone stays below its pm.max_children, but on
; FreeFlarum (the same setup) a crawl of ~280 forums at once started ~300 workers, mostly idle ones waiting for their
; pm.process_idle_timeout: PHP-FPM filled its MemoryMax and the server thrashed (16 Nov 2026).
; Only a last resort below MemoryMax, not a limit for normal load: at the limit a request to a pool without an idle
; worker waits in the pool's socket queue, ondemand forks only on the pool's next connection; nginx answers requests
; above it with 503 at once (php_all, apps/*.conf). FPM logs "The maximum number of processes has been reached".
process.max = {{ php_fpm_process_max }}
include=/etc/php/fpm/pool.d/*

; minimal placeholder pool to satisfy php-fpm's "at least 1 pool" requirement
; this pool is never actually used, it just allows PHP-FPM to start
; before any tenant pools are created.
[-]
user = nobody
group = nogroup
listen = /run/php/_
listen.owner = nobody
listen.group = nogroup
listen.mode = 0000
pm = ondemand
pm.max_children = 1

