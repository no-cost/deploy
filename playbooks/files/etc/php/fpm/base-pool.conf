chroot = {{ paths.tenants.root }}/$pool
prefix = {{ paths.tenants.root }}/$pool/public
chdir = /

user = tenant_$pool
group = tenant_$pool

process.priority = 19
process.dumpable = no

listen = /run/php/php-fpm.$pool.sock
listen.group = www-data
listen.owner = tenant_$pool
listen.mode = 0660

pm = ondemand
pm.max_children = 50
pm.process_idle_timeout = 10s
pm.max_requests = 500

catch_workers_output = yes
php_admin_value[display_errors] = 0
php_admin_value[error_log] = /logs/php-fpm.log

php_admin_value[allow_url_fopen] = 0
php_admin_value[allow_url_include] = 0
; Flarum: umask needed for cache clear via admin, etc.
; MediaWiki: php_uname (to load uploaded file), sys_get_temp_dir (to load pages at all), proc_open/proc_close/proc_get_status (for imagemagick thumbnail gen via shellbox)
php_admin_value[disable_functions] = phpinfo,getallheaders,virtual,chdir,chroot,exec,ini_alter,ini_get_all,ini_restore,parse_ini_file,passthru,proc_nice,proc_terminate,shell_exec,system,chgrp,chown,disk_free_space,disk_total_space,diskfreespace,filegroup,fileinode,fileowner,lchgrp,lchown,link,linkinfo,lstat,pclose,popen,readlink,symlink,cli_get_process_title,cli_set_process_title,dl,gc_collect_cycles,gc_disable,gc_enable,get_current_user,getmygid,getmyinode,getmypid,getmyuid,php_ini_loaded_file,php_ini_scanned_files,php_logo_guid,php_sapi_name,zend_logo_guid,zend_thread_id,highlight_file,php_check_syntax,show_source,sys_getloadavg,closelog,define_syslog_variables,openlog,pfsockopen,syslog,nsapi_request_headers,nsapi_response_headers,nsapi_virtual,pcntl_alarm,pcntl_errno,pcntl_exec,pcntl_fork,pcntl_get_last_error,pcntl_getpriority,pcntl_setpriority,pcntl_signal_dispatch,pcntl_signal,pcntl_sigprocmask,pcntl_sigtimedwait,pcntl_sigwaitinfo,pcntl_strerror,pcntl_wait,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_wtermsig,posix_access,posix_ctermid,posix_errno,posix_get_last_error,posix_getcwd,posix_getegid,posix_geteuid,posix_getgid,posix_getgrgid,posix_getgrnam,posix_getgroups,posix_getlogin,posix_getpgid,posix_getpgrp,posix_getpid,posix_getppid,posix_getpwnam,posix_getpwuid,posix_getrlimit,posix_getsid,posix_getuid,posix_initgroups,posix_isatty,posix_kill,posix_mkfifo,posix_mknod,posix_setegid,posix_seteuid,posix_setgid,posix_setpgid,posix_setsid,posix_setuid,posix_strerror,posix_times,posix_ttyname,posix_uname,setproctitle,setthreadtitle,shmop_close,shmop_delete,shmop_open,shmop_read,shmop_size,shmop_write,opcache_compile_file,opcache_get_configuration,opcache_get_status,opcache_invalidate,opcache_is_script_cached,opcache_reset
php_admin_value[doc_root] = /public
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_flag[expose_php] = Off

; PEAR packages (used by MediaWiki SMTP) require include_path for legacy require() calls
php_admin_value[include_path] = .:/app/public/vendor/pear/pear-core-minimal/src:/app/public/vendor/pear/net_socket:/app/public/vendor/pear/net_smtp:/app/public/vendor/pear/mail
php_admin_value[open_basedir] = /etc/config.json:/app/:/logs/:/tmp:/session:/dev/urandom:/bin/bash
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[session.save_path] = /session
php_admin_value[openssl.capath] = /etc/ssl/certs
