# Chrony Configuration File
# =========================

# NTP Servers
# -----------
# Primary internal NTP server with burst on startup
server ntp.lab.int iburst prefer

# Fallback public NTP pool servers for redundancy
pool 0.pool.ntp.org iburst maxsources 2
pool 1.pool.ntp.org iburst maxsources 2

# File Paths
# ----------
# Store drift information to maintain accuracy across restarts
driftfile /var/lib/chrony/drift

# Authentication keys file
keyfile /etc/chrony.keys

# Leap seconds timezone database
leapsectz right/UTC

# Logging directory
logdir /var/log/chrony

# Time Synchronization
# --------------------
# Allow large time corrections during first 3 updates
makestep 1.0 3

# Sync system RTC to NTP time
rtcsync

# Security & Access Control
# ------------------------
# Allow NTP client connections from local network only
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

# Deny all other clients
deny all

# Performance Tuning
# -----------------
# Maximum update skew (helps with variable network latency)
maxupdateskew 100.0

# Minimum number of sources required before updating system time
minsources 2

# Monitoring & Logging
# -------------------
# Log measurements, statistics, and tracking
log measurements statistics tracking

# Rate limiting for NTP requests (prevent abuse)
ratelimit interval 1 burst 16

# Command access via chronyc (localhost only for security)
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
