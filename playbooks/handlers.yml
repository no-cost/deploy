- name: reload-mariadb
  ansible.builtin.systemd_service:
    name: mariadb
    daemon_reload: false
    state: reloaded


- name: restart-mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted


- name: restart-fpm
  ansible.builtin.systemd_service:
    name: php{{ php_version }}-fpm
    state: restarted
    daemon_reload: false


- name: reload-postfix
  ansible.builtin.service:
    name: postfix
    state: reloaded


- name: reload-daemon
  ansible.builtin.systemd_service:
    daemon_reload: false
