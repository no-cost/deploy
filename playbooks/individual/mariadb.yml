- name: Add MariaDB signing key
  ansible.builtin.apt_key:
      url: https://mariadb.org/mariadb_release_signing_key.asc
      keyring: /usr/share/keyrings/mariadb.gpg
      state: present

- name: Add MariaDB APT repository
  ansible.builtin.apt_repository:
      repo: deb [arch=amd64,arm64,ppc64el,s390x signed-by=/usr/share/keyrings/mariadb.gpg] http://mirror.mariadb.org/repo/{{ mariadb_version }}/ubuntu/ jammy main
      state: present

- name: Install MariaDB
  ansible.builtin.apt:
      state: present
      update_cache: true
      pkg:
          - mariadb-server
          - mariadb-client

- name: Adjust OS open file limit for MariaDB
  ansible.builtin.copy:
      src: files/etc/security/limits.d/99-openfiles.conf
      dest: /etc/security/limits.d/
      mode: "0644"

- name: Add MariaDB file limit override to systemd
  ansible.builtin.copy:
      src: files/etc/systemd/system/mariadb.service.d/limits.conf
      dest: /etc/systemd/system/mariadb.service.d/limits.conf
      mode: "0644"
  notify: reload-mariadb

- name: Configure MariaDB for higher open file limit
  ansible.builtin.copy:
      src: files/etc/mysql/conf.d/openfiles.cnf
      dest: /etc/mysql/conf.d/openfiles.cnf
      mode: "0644"
  notify: restart-mariadb

- name: Ensure that MariaDB service is started
  ansible.builtin.service:
      name: mariadb
      enabled: true
      state: started

- name: Setup MariaDB data directory
  ansible.builtin.command:
      cmd: mariadb-install-db --datadir=/var/mysql --auth-root-authentication-method=socket
  register: output
  changed_when: output.rc != 0
