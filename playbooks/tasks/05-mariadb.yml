---
- name: Install MariaDB
  ansible.builtin.apt:
      name:
          - mariadb-server
          - mariadb-client
          - python3-pymysql
      state: present

- name: Configure MariaDB for production
  ansible.builtin.template:
      src: files/etc/mysql/mariadb.conf.d/50-server.cnf
      dest: /etc/mysql/mariadb.conf.d/50-server.cnf
      mode: "644"
      backup: true
  notify: restart mariadb

- name: Set MariaDB systemd limits
  ansible.builtin.copy:
      src: files/etc/systemd/system/mariadb.service.d/limits.conf
      dest: /etc/systemd/system/mariadb.service.d/limits.conf
      mode: "644"

- name: Ensure MariaDB is running
  ansible.builtin.systemd:
      name: mariadb
      enabled: true
      state: restarted
      daemon_reload: true

# TODO: MariaDB login only via sock, no remote connection allowed, no binding to ports

- name: Set MariaDB root password
  community.mysql.mysql_user:
      name: root
      password: "{{ mariadb.root_password }}"
      login_unix_socket: /var/run/mysqld/mysqld.sock
      state: present

- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
      name: ""
      host_all: true
      state: absent
      login_user: root
      login_password: "{{ mariadb.root_password }}"

- name: Remove MySQL test database
  community.mysql.mysql_db:
      name: test
      state: absent
      login_user: root
      login_password: "{{ mariadb.root_password }}"

- name: Create databases for services
  community.mysql.mysql_db:
      name: freeflarum
      encoding: utf8mb4
      collation: utf8mb4_unicode_ci
      state: present
      login_user: root
      login_password: "{{ mariadb.root_password }}"

- name: Create MySQL backup user
  community.mysql.mysql_user:
      name: backup
      password: "{{ mariadb.backup_password }}"
      priv: "*.*:SELECT,LOCK TABLES,SHOW VIEW,EVENT,TRIGGER"
      host: localhost
      state: present
      login_user: root
      login_password: "{{ mariadb.root_password }}"

- name: Configure log rotation for MariaDB
  ansible.builtin.copy:
      src: files/etc/logrotate.d/mariadb
      dest: /etc/logrotate.d/mariadb
      mode: "644"
