---
- name: Install Certbot
  ansible.builtin.apt:
      name:
          - certbot
          - python3-certbot-nginx
      state: present
  tags: ["ssl", "certificates", "certbot"]

- name: Ensure SSL directories
  ansible.builtin.file:
      path: "{{ le_dir.path }}"
      state: directory
      mode: "{{ le_dir.mode }}"
      owner: root
      group: "{{ le_dir.group }}"
  loop:
      - path: /etc/ssl/cloudflare
        mode: "0755"
        group: www-data
      - path: /etc/letsencrypt
        mode: "0750"
        group: www-data
      - path: /etc/letsencrypt/renewal-hooks/deploy
        mode: "0755"
        group: root
      - path: /var/lib/letsencrypt
        mode: "0755"
        group: root
      - path: /var/log/letsencrypt
        mode: "0755"
        group: root
  loop_control:
      loop_var: le_dir
  tags: ["ssl", "certificates", "certbot"]

- name: Deploy Certbot renewal hook for nginx permissions
  ansible.builtin.copy:
      src: files/etc/letsencrypt/renewal-hooks/deploy/fix-permissions.sh
      dest: /etc/letsencrypt/renewal-hooks/deploy/fix-permissions.sh
      mode: "0755"
      owner: root
      group: root
  tags: ["ssl", "certificates", "certbot"]

- name: Install dhparam for better SSL grade
  ansible.builtin.copy:
      content: "{{ dh_param }}"
      dest: "/etc/ssl/certs/dhparam.pem"
      owner: root
      group: root
      mode: "644"
  notify: reload nginx

- name: Set up Certbot renewal cron job
  ansible.builtin.cron:
      name: "Renew Let's Encrypt certificates"
      minute: "0"
      hour: "2"
      job: "/usr/bin/certbot renew --quiet"
      user: root
      state: present
  tags: ["ssl", "certificates"]

- name: Configure Certbot webroot
  ansible.builtin.template:
      src: files/etc/letsencrypt/cli.ini
      dest: /etc/letsencrypt/cli.ini
      mode: "644"
  tags: ["ssl", "certificates", "certbot"]

- name: Ensure wildcard SSL certificate directories
  ansible.builtin.file:
      path: "/etc/ssl/cloudflare/{{ domain }}"
      state: directory
      mode: "755"
      owner: www-data
      group: www-data
  loop: "{{ domains.keys() | list }}"
  loop_control:
      loop_var: domain
  when: domains is defined
  tags: ["ssl", "certificates"]

- name: Configure wildcard SSL certificates
  ansible.builtin.copy:
      content: "{{ domains[domain].ssl_certificate_pem }}"
      dest: "/etc/ssl/cloudflare/{{ domain }}/fullchain.pem"
      mode: "644"
      owner: www-data
      group: www-data
  loop: "{{ domains.keys() | list }}"
  loop_control:
      loop_var: domain
  when: domains is defined
  notify: reload nginx
  tags: ["ssl", "certificates"]

- name: Configure wildcard SSL certificate keys
  ansible.builtin.copy:
      content: "{{ domains[domain_key].ssl_certificate_key }}"
      dest: "/etc/ssl/cloudflare/{{ domain_key }}/privkey.pem"
      mode: "600"
      owner: www-data
      group: www-data
  loop: "{{ domains.keys() | list }}"
  loop_control:
      loop_var: domain_key
  when: domains is defined
  notify: reload nginx
  tags: ["ssl", "certificates"]
