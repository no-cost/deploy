---
# https://github.com/FreeFlarum/freeflarum/blob/b1627f5e7ca1462272781e3b5a233d1226f89dfa/deploy/playbooks/main.yml#L41C1-L44C37
- name: Install Certbot
  ansible.builtin.apt:
      name:
          - certbot
          - python3-certbot-nginx
      state: present
  tags: ["ssl", "certificates", "certbot"]

- name: Create SSL directories
  ansible.builtin.file:
      path: "{{ le_path }}"
      state: directory
      mode: "755"
      owner: root
      group: root
  loop:
      - /etc/ssl/cloudflare
      - /etc/letsencrypt
      - /var/lib/letsencrypt
      - /var/log/letsencrypt
      - /srv/certbot
  loop_control:
      loop_var: le_path
  tags: ["ssl", "certificates", "certbot"]

- name: Set up Certbot renewal cron job
  ansible.builtin.cron:
      name: "Renew Let's Encrypt certificates"
      minute: "0"
      hour: "2"
      job: "/usr/bin/certbot renew --quiet"
      user: root
      state: present
  tags: ["ssl", "certificates"]

- name: Configure Certbot webroot
  ansible.builtin.template:
      src: files/etc/letsencrypt/cli.ini
      dest: /etc/letsencrypt/cli.ini
      mode: "644"
  tags: ["ssl", "certificates", "certbot"]

- name: Configure SSL certificates
  ansible.builtin.copy:
      content: "{{ domains[domain].ssl_certificate_pem }}"
      dest: "/etc/ssl/cloudflare/{{ domain }}.pem"
      mode: "644"
      owner: www-data
      group: www-data
  loop: "{{ domains.keys() | list }}"
  loop_control:
      loop_var: domain
  when: domains is defined
  tags: ["ssl", "certificates"]

- name: Configure SSL certificate keys
  ansible.builtin.copy:
      content: "{{ domains[domain_key].ssl_certificate_key }}"
      dest: "/etc/ssl/cloudflare/{{ domain_key }}.key"
      mode: "600"
      owner: www-data
      group: www-data
  loop: "{{ domains.keys() | list }}"
  loop_control:
      loop_var: domain_key
  when: domains is defined
  tags: ["ssl", "certificates"]
