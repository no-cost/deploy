---
- name: Clone or update freeflarum backend repository
  ansible.builtin.git:
      repo: "git@github.com:FreeFlarum/freeflarum-backend.git"
      dest: "{{ paths.freeflarum_backend_repo }}"
      version: "master"
      force: true

- name: Create required directories for freeflarum
  ansible.builtin.file:
      path: "{{ tenant_dir }}"
      state: directory
      owner: www-data
      group: www-data
      mode: "0755"
  loop:
      - "{{ paths.tenants.flarum_skeleton }}"
      - "{{ paths.tenants.wordpress_skeleton }}"
  loop_control:
      loop_var: tenant_dir

- name: Create virtual environment for main site
  ansible.builtin.command:
      cmd: "python{{ python_version }} -m venv {{ paths.freeflarum_backend_repo }}/.venv"
      creates: "{{ paths.freeflarum_backend_repo }}/.venv/bin/python"

- name: Install Python packages for main site
  ansible.builtin.pip:
      requirements: "{{ paths.freeflarum_backend_repo }}/requirements.txt"
      virtualenv: "{{ paths.freeflarum_backend_repo }}/.venv"
      virtualenv_python: "python{{ python_version }}"

- name: Ensure FreeFlarum log directory
  ansible.builtin.file:
      path: /var/log/freeflarum/api/
      state: directory
      owner: www-data
      group: www-data
      mode: "755"

- name: Create systemd service files for FreeFlarum
  ansible.builtin.template:
      src: "files/etc/systemd/system/{{ freeflarum_service }}"
      dest: "/etc/systemd/system/{{ freeflarum_service }}"
      mode: "644"
  loop:
      - freeflarum.service
      - freeflarum.socket
  loop_control:
      loop_var: freeflarum_service
  notify:
      - daemon reload

- name: Enable FreeFlarum service
  ansible.builtin.systemd:
      name: freeflarum.service
      enabled: true
      state: started

- name: Create environment configuration for freeflarum backend
  ansible.builtin.copy:
      dest: "{{ paths.freeflarum_backend_repo }}/.env"
      # TODO
      content: |
          # FreeFlarum Backend Configuration
          DATABASE_HOST=localhost
          DATABASE_NAME=freeflarum
          DATABASE_USER=freeflarum

          # Paths
          TENANT_ROOT={{ paths.tenants.root }}
          FLARUM_SKELETON={{ paths.tenants.flarum_skeleton }}
          WORDPRESS_SKELETON={{ paths.tenants.wordpress_skeleton }}
          BACKUP_ROOT={{ paths.backup_root }}

          # Domains
          PRIMARY_DOMAINS=freeflarum.com,flarum.cloud
      owner: www-data
      group: www-data
      mode: "0640"

- name: Create database for freeflarum backend
  community.mysql.mysql_db:
      name: freeflarum
      encoding: utf8mb4
      collation: utf8mb4_unicode_ci
      login_unix_socket: /var/run/mysqld/mysqld.sock
      state: present

- name: Create database user for freeflarum backend
  community.mysql.mysql_user:
      name: freeflarum
      priv: "freeflarum.*:ALL"
      plugin: unix_socket
      plugin_auth_string: ""
      host: localhost
      login_unix_socket: /var/run/mysqld/mysqld.sock
      state: present
