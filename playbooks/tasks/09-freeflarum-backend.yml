---
- name: Clone or update freeflarum backend repository
  ansible.builtin.git:
      repo: "https://github.com/FreeFlarum/freeflarum-backend.git"
      dest: "{{ freeflarum_backend_repo }}"
      version: "main"
      force: true

- name: Create required directories for freeflarum
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: www-data
      group: www-data
      mode: "0755"
  loop:
      - "{{ freeflarum_backend_repo }}/public"
      - "{{ freeflarum_backend_repo }}/logs"
      - "{{ freeflarum_backend_repo }}/tmp"
      - "{{ skeleton_root }}"
      - "{{ skeleton_root }}/flarum"
      - "{{ skeleton_root }}/wordpress"

- name: Set permissions on freeflarum directory
  ansible.builtin.file:
      path: "{{ freeflarum_backend_repo }}"
      owner: www-data
      group: www-data
      recurse: true
      mode: "0755"

- name: Create virtual environment for main site
  ansible.builtin.command:
      cmd: "python{{ python_version }} -m venv {{ freeflarum_backend_repo }}/.venv"
      creates: "{{ freeflarum_backend_repo }}/.venv/bin/python"

- name: Install Python packages for main site
  ansible.builtin.pip:
      requirements: "{{ freeflarum_backend_repo }}/requirements.txt"
      virtualenv: "{{ freeflarum_backend_repo }}/.venv"
      virtualenv_python: "python{{ python_version }}"

- name: Create systemd service files for FreeFlarum
  ansible.builtin.template:
      src: "files/etc/systemd/system/{{ item }}"
      dest: "/etc/systemd/system/{{ item }}"
      mode: "644"
  loop:
      - freeflarum.service
      - freeflarum.socket
  notify:
      - daemon reload
      - restart freeflarum

- name: Create symlinks for management scripts
  ansible.builtin.file:
      src: "{{ freeflarum_backend_repo }}/bin/{{ item }}"
      dest: "/usr/local/bin/{{ item }}"
      state: link
  loop:
      - health_check
      - cleanup
      - manage-chroot
      - manage-ssl
      - monitor-tenant-usage

- name: Create environment configuration for freeflarum backend
  ansible.builtin.copy:
      dest: "{{ freeflarum_backend_repo }}/.env"
      # TODO
      content: |
          # FreeFlarum Backend Configuration
          DATABASE_HOST=localhost
          DATABASE_NAME=freeflarum
          DATABASE_USER=freeflarum

          # Paths
          TENANT_ROOT={{ tenants_root }}
          SKELETON_ROOT={{ skeleton_root }}
          BACKUP_ROOT={{ backup_root }}

          # Domains
          PRIMARY_DOMAINS=freeflarum.com,flarum.cloud
      owner: www-data
      group: www-data
      mode: "0640"

- name: Create database for freeflarum backend
  community.mysql.mysql_db:
      name: freeflarum
      encoding: utf8mb4
      collation: utf8mb4_unicode_ci
      login_unix_socket: /var/run/mysqld/mysqld.sock
      state: present

- name: Create database user for freeflarum backend
  community.mysql.mysql_user:
      name: freeflarum
      priv: "freeflarum.*:ALL"
      plugin: unix_socket
      plugin_auth_string: ""
      host: localhost
      login_unix_socket: /var/run/mysqld/mysqld.sock
      state: present

