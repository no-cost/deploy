---
- name: Setup common skeleton app structure
  ansible.builtin.include_tasks: ./_common.yml
  vars:
      skeleton_root_dir: "{{ paths.tenants.flarum_skeleton }}"
  tags: ["skeleton", "flarum"]

# https://docs.flarum.org/install/
- name: Unarchive Flarum
  ansible.builtin.unarchive:
      src: "https://github.com/no-cost/flarum-multitenant/archive/refs/heads/main.tar.gz"
      dest: "{{ paths.tenants.flarum_skeleton }}/app"
      remote_src: true
      owner: www-data
      group: www-data
      mode: "0775"
      extra_opts: ["--strip-components=1"] # strip root version folder
  tags: ["skeleton", "flarum"]

- name: Upgrade all Flarum forums
  ansible.builtin.command:
      cmd: "{{ paths.backend_bin_root }}/upgrade -s flarum"
      chdir: "{{ paths.backend_root }}"
  become: true
  become_user: nocost
  changed_when: false
  tags: ["upgrade"]
