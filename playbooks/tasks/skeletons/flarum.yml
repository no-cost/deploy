---
- name: Setup common skeleton app structure
  ansible.builtin.include_tasks: ./helpers/common.yml
  vars:
      skeleton_root_dir: "{{ paths.tenants.flarum_skeleton }}"
  tags: [always]

# https://docs.flarum.org/install/
- name: Install Flarum in app directory
  ansible.builtin.command:
      cmd: "composer create-project flarum/flarum:^1.8.1 app"
      chdir: "{{ paths.tenants.flarum_skeleton }}"
      creates: "{{ paths.tenants.flarum_skeleton }}/app/composer.json"
  become: true
  become_user: "www-data"
  tags: ["skeleton", "flarum"]

- name: Overwrite config.php with JSON loader from /etc/config.json
  ansible.builtin.copy:
      src: files/srv/skeleton/flarum/app/config.php
      dest: "{{ paths.tenants.flarum_skeleton }}/app/config.php"
      owner: "www-data"
      group: "www-data"
      mode: "644"
  tags: ["skeleton", "flarum"]

- name: Create skeleton host instance
  ansible.builtin.include_tasks: ../tenants/main.yml
  vars:
      service_type: "flarum"
      tenant_tag: "flarum_skeleton"
      tenant_db_password: "{{ skeletons.flarum_db_password }}"
      tenant_admin_email: "info@{{ main_domain }}"
      # bcrypt encrypted:
      tenant_admin_password: "{{ skeletons.flarum_admin_password }}"
      force: true
  tags: [always]
