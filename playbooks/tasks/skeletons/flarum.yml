---
- name: Gather architecture facts
  ansible.builtin.setup:
      gather_subset:
          - architecture

- name: Create required directories for Flarum skeleton
  ansible.builtin.file:
      state: "directory"
      path: "{{ paths.tenants.flarum_skeleton }}{{ dir }}"
      owner: www-data
      group: www-data
      mode: "775"
      recurse: true
  loop:
      - "/app"
      - "/bin"
      - "/etc/ssl/certs"
      - "/sessions"
      - "/tmp"
      - "/usr/bin"
      - "/usr/lib/{{ ansible_architecture }}-linux-gnu"
      - "/usr/share/zoneinfo"
  loop_control:
      loop_var: "dir"

- name: Create hardlinks for required system files
  ansible.builtin.file:
      src: "{{ hardlink.src }}"
      dest: "{{ hardlink.dest }}"
      state: hard
      mode: "{{ hardlink.mode | default('644') }}"
      force: true
  loop:
      - src: "/usr/bin/dash"
        dest: "{{ paths.tenants.flarum_skeleton }}/usr/bin/dash"
        mode: "755"
      - src: "/etc/ssl/certs/ca-certificates.crt"
        dest: "{{ paths.tenants.flarum_skeleton }}/etc/ssl/certs/ca-certificates.crt"
      - src: "/usr/lib/{{ ansible_architecture }}-linux-gnu/libnss_dns.so.2"
        dest: "{{ paths.tenants.flarum_skeleton }}/usr/lib/{{ ansible_architecture }}-linux-gnu/libnss_dns.so.2"
  loop_control:
      loop_var: hardlink

- name: Create symlinks
  ansible.builtin.file:
      src: "{{ symlink.src }}"
      dest: "{{ symlink.dest }}"
      owner: www-data
      group: www-data
      force: true
      follow: false
      state: link
  loop:
      # relative paths for chroot
      - src: "app/public"
        dest: "{{ paths.tenants.flarum_skeleton }}/public"
      - src: "usr/bin/dash"
        dest: "{{ paths.tenants.flarum_skeleton }}/bin/sh"
      - src: "usr/lib"
        dest: "{{ paths.tenants.flarum_skeleton }}/lib"
  loop_control:
      loop_var: symlink

- name: Recursively hardlink zoneinfo
  ansible.posix.synchronize:
      src: /usr/share/zoneinfo/
      dest: "{{ paths.tenants.flarum_skeleton }}/usr/share/zoneinfo"
      rsync_opts:
          - "--link-dest=/usr/share/zoneinfo"
  delegate_to: "{{ inventory_hostname }}"

# https://docs.flarum.org/install/
- name: Install Flarum
  ansible.builtin.command:
      cmd: "composer create-project flarum/flarum:^1.8.0 {{ paths.tenants.flarum_skeleton }}/app"
      creates: "{{ paths.tenants.flarum_skeleton }}/app/composer.json"
  become: true
  become_user: "www-data"

- name: Overwrite config.php with JSON loader from /etc/config.json
  ansible.builtin.copy:
      src: files/srv/skeleton/flarum/app/config.php
      dest: "{{ paths.tenants.flarum_skeleton }}/app/config.php"
      owner: "www-data"
      group: "www-data"
      mode: "644"

- name: Create skeleton host instance
  ansible.builtin.include_tasks: ../tenants/main.yml
  vars:
      tenant_tag: "flarum_skeleton"
      tenant_db_password: "{{ skeletons.flarum_db_password }}"
      service_type: "flarum"
      tenant_admin_email: "info@{{ main_domain }}"
      force: true
