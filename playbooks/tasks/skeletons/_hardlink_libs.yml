---
# helper to hardlink shared libraries into a skeleton, resolving symlinks to real paths;
# when a library is a symlink, the real file is hardlinked and the symlink is recreated
#
#   - skeleton_root_dir: root directory of the skeleton
#   - lib_paths: list of absolute library paths on the host

- name: Resolve real paths of libraries
  ansible.builtin.shell:
      cmd: |
          for lib in {{ lib_paths | map('quote') | join(' ') }}; do
              [ -f "$lib" ] || continue
              realpath "$lib"
          done | sort -u
      executable: /bin/bash
  register: _lib_realpaths
  changed_when: false
  tags: [always]

- name: Identify library symlinks to recreate
  ansible.builtin.shell:
      cmd: |
          for lib in {{ lib_paths | map('quote') | join(' ') }}; do
              [ -L "$lib" ] || continue
              real=$(realpath "$lib")
              target=$(realpath --relative-to="$(dirname "$lib")" "$real")
              printf '{"path":"%s","target":"%s"}\n' "$lib" "$target"
          done
      executable: /bin/bash
  register: _lib_symlinks_raw
  changed_when: false
  tags: [always]

- name: Parse symlink entries
  ansible.builtin.set_fact:
      _lib_symlinks: "{{ _lib_symlinks_raw.stdout_lines | select | map('from_json') | list }}"
  tags: [always]

- name: Build unique directory list for libraries
  ansible.builtin.set_fact:
      _lib_dirs: "{{ _lib_realpaths.stdout_lines | map('dirname') | unique | list }}"
  tags: [always]

- name: Ensure library directories exist in skeleton
  ansible.builtin.file:
      path: "{{ skeleton_root_dir }}{{ lib_dir }}"
      state: directory
      mode: "0755"
  loop: "{{ _lib_dirs }}"
  loop_control:
      loop_var: lib_dir
  tags: [always]

- name: Hardlink resolved libraries into skeleton
  ansible.builtin.file:
      src: "{{ lib_real }}"
      dest: "{{ skeleton_root_dir }}{{ lib_real }}"
      state: hard
      force: true
  loop: "{{ _lib_realpaths.stdout_lines }}"
  loop_control:
      loop_var: lib_real
      label: "{{ lib_real | basename }}"
  tags: [always]

- name: Recreate library symlinks in skeleton
  ansible.builtin.file:
      src: "{{ lib_symlink.target }}"
      path: "{{ skeleton_root_dir }}{{ lib_symlink.path }}"
      state: link
      force: true
      follow: false
  loop: "{{ _lib_symlinks }}"
  loop_control:
      loop_var: lib_symlink
      label: "{{ lib_symlink.path | basename }}"
  when: _lib_symlinks | length > 0
  tags: [always]
