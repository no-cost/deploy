---
# common tasks for skeletons
# child of: `flarum.yml`, `mediawiki.yml`, `wordpress.yml`
# params:
#   - skeleton_root_dir: root directory of the skeleton

- name: Ensure required directories for {{ skeleton_root_dir }}
  ansible.builtin.file:
      state: "directory"
      path: "{{ skeleton_root_dir }}/{{ php_dir }}"
      owner: www-data
      group: www-data
      mode: "0775"
      recurse: true
  loop:
      - "app/public"
      - "bin"
      - "dev"
      - "etc/ssl/certs"
      - "logs"
      - "session"
      - "tmp"
      - "usr/bin"
      - "usr/lib"
      - "usr/sbin"
      - "usr/share/zoneinfo"
  loop_control:
      loop_var: "php_dir"
  tags: [always]

# https://tldp.org/LDP/Linux-Filesystem-Hierarchy/html/dev.html
- name: Ensure dev files
  ansible.builtin.command:
      cmd: "mknod -m {{ dev_file.mode }} {{ skeleton_root_dir }}/dev/{{ dev_file.name }} {{ dev_file.type }} {{ dev_file.major }} {{ dev_file.minor }}"
      creates: "{{ skeleton_root_dir }}/dev/{{ dev_file.name }}"
  become: true
  loop:
      - name: "null"
        type: "c"
        major: 1
        minor: 3
        mode: "0666"
      - name: "zero"
        type: "c"
        major: 1
        minor: 5
        mode: "0666"
      - name: "full"
        type: "c"
        major: 1
        minor: 7
        mode: "0666"
      - name: "random"
        type: "c"
        major: 1
        minor: 8
        mode: "0444"
      - name: "urandom"
        type: "c"
        major: 1
        minor: 9
        mode: "0444"
      - name: "tty"
        type: "c"
        major: 5
        minor: 0
        mode: "0666"
      - name: "console"
        type: "c"
        major: 5
        minor: 1
        mode: "0600"
      - name: "ptmx"
        type: "c"
        major: 5
        minor: 2
        mode: "0666"
  loop_control:
      loop_var: "dev_file"
  tags: [always]

- name: Ensure hardlinks for required system files
  ansible.builtin.file:
      src: "{{ php_hardlink.src }}"
      dest: "{{ php_hardlink.dest }}"
      state: hard
      mode: "0755"
      owner: root
      group: root
      force: true
  loop:
      - src: "/etc/ssl/certs/ca-certificates.crt"
        dest: "{{ skeleton_root_dir }}/etc/ssl/certs/ca-certificates.crt"
      - src: "/usr/bin/bash"
        dest: "{{ skeleton_root_dir }}/usr/bin/bash"
      - src: "/usr/bin/dash"
        dest: "{{ skeleton_root_dir }}/usr/bin/dash"
      - src: "/usr/bin/dash"
        dest: "{{ skeleton_root_dir }}/usr/bin/sh"
  loop_control:
      loop_var: php_hardlink
  tags: [always]

- name: Ensure symlinks
  ansible.builtin.file:
      src: "{{ php_symlink.src }}"
      path: "{{ php_symlink.path }}"
      owner: www-data
      group: www-data
      force: true
      follow: false
      state: link
  loop:
      # relative paths for chroot
      - src: "app/public"
        path: "{{ skeleton_root_dir }}/public"
      - src: "usr/bin"
        path: "{{ skeleton_root_dir }}/bin"
      - src: "usr/sbin"
        path: "{{ skeleton_root_dir }}/sbin"
      - src: "usr/lib"
        path: "{{ skeleton_root_dir }}/lib"
  loop_control:
      loop_var: php_symlink
  tags: [always]

- name: Recursively hardlink shared libraries into skeleton
  ansible.posix.synchronize:
      src: /usr/lib/aarch64-linux-gnu/
      dest: "{{ skeleton_root_dir }}/usr/lib/aarch64-linux-gnu"
      rsync_opts:
          - "--link-dest=/usr/lib/aarch64-linux-gnu"
  delegate_to: "{{ inventory_hostname }}"
  tags: [always]

- name: Symlink dynamic linker into skeleton
  ansible.builtin.file:
      src: aarch64-linux-gnu/ld-linux-aarch64.so.1
      path: "{{ skeleton_root_dir }}/usr/lib/ld-linux-aarch64.so.1"
      state: link
      force: true
      follow: false
  tags: [always]

- name: Recursively hardlink zoneinfo
  ansible.posix.synchronize:
      src: /usr/share/zoneinfo/
      dest: "{{ skeleton_root_dir }}/usr/share/zoneinfo"
      rsync_opts:
          - "--link-dest=/usr/share/zoneinfo"
  delegate_to: "{{ inventory_hostname }}"
  tags: [always]
