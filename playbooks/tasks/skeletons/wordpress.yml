---
- name: Setup common skeleton app structure
  ansible.builtin.include_tasks: ./_common.yml
  vars:
      skeleton_root_dir: "{{ paths.tenants.wordpress_skeleton }}"
  tags: ["skeleton", "wordpress"]

- name: Install WP-CLI system-wide
  ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar"
      dest: "/usr/bin/wp"
      owner: root
      group: root
      mode: "755"
  tags: ["skeleton", "wordpress"]

- name: Sync WordPress skeleton
  ansible.builtin.include_tasks: ./_sync_archive.yml
  vars:
      archive_url: "https://github.com/no-cost/wordpress-multitenant/archive/refs/heads/main.tar.gz"
      sync_dest: "{{ paths.tenants.wordpress_skeleton }}/app/public"
  tags: ["skeleton", "wordpress"]

- name: Write secrets.php file
  ansible.builtin.template:
      src: files/srv/skeleton/wordpress/secrets.php
      dest: "{{ paths.tenants.wordpress_skeleton }}/app/public/secrets.php"
      owner: "www-data"
      group: "www-data"
      mode: "0644"
  tags: ["skeleton", "wordpress"]

- name: Upgrade all WordPress sites
  ansible.builtin.command:
      cmd: "{{ paths.backend_bin_root }}/upgrade_site -s wordpress"
      chdir: "{{ paths.backend_root }}"
  become: true
  become_user: nocost
  changed_when: false
  async: 3600
  poll: 0
  tags: [never, "upgrade"]
