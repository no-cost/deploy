# https://www.mediawiki.org/wiki/Download
- name: Download & unarchive Mediawiki
  ansible.builtin.unarchive:
      remote_src: true
      src: "https://releases.wikimedia.org/mediawiki/{{ skeletons_pub.mediawiki_major + '/mediawiki-' + skeletons_pub.mediawiki_version + '.zip' }}"
      dest: /tmp/
      mode: "775"
  tags: ["skeleton", "mediawiki"]

- name: Ensure public dir
  ansible.builtin.file:
      path: "{{ paths.tenants.mediawiki_skeleton }}/app/public"
      state: directory
      owner: "www-data"
      group: "www-data"
      mode: "775"
  tags: ["skeleton", "mediawiki"]

- name: Move MediaWiki files to app directory
  ansible.builtin.shell:
      cmd: |
          mv /tmp/mediawiki-{{ skeletons_pub.mediawiki_version }}/* {{ (paths.tenants.mediawiki_skeleton + '/app/public/') | quote }}
          rm -r /tmp/mediawiki-{{ skeletons_pub.mediawiki_version }}
      creates: "{{ paths.tenants.mediawiki_skeleton }}/app/public/index.php"
  tags: ["skeleton", "mediawiki"]
