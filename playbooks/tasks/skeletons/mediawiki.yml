---
- name: Setup common skeleton app structure
  ansible.builtin.include_tasks: ./_common.yml
  vars:
      skeleton_root_dir: "{{ paths.tenants.mediawiki_skeleton }}"
  tags: ["skeleton", "mediawiki"]

- name: Install MediaWiki dependencies
  ansible.builtin.apt:
      name:
          - imagemagick
          - diffutils
      state: present
      update_cache: true
  tags: ["skeleton", "mediawiki"]

- name: Create hardlink for MediaWiki diff3 binary
  ansible.builtin.file:
      src: "{{ mw_hardlink.src }}"
      dest: "{{ mw_hardlink.dest }}"
      state: hard
      force: true
      owner: root
      group: root
      mode: "755"
  loop:
      - src: "/usr/bin/diff3"
        dest: "{{ paths.tenants.mediawiki_skeleton }}/usr/bin/diff3"
  loop_control:
      loop_var: mw_hardlink
  tags: ["skeleton", "chroot", "mediawiki"]

- name: Create hardlink for ImageMagick binary
  ansible.builtin.file:
      src: "/usr/bin/convert-im6.q16"
      dest: "{{ paths.tenants.mediawiki_skeleton }}/usr/bin/convert"
      state: hard
      mode: "0755"
      owner: root
      group: root
  tags: ["skeleton", "mediawiki"]

- name: Ensure public dir
  ansible.builtin.file:
      path: "{{ paths.tenants.mediawiki_skeleton }}/app/public"
      state: directory
      owner: "www-data"
      group: "www-data"
      mode: "0775"
  tags: ["skeleton", "mediawiki"]

# note: we have observed that fetching releases from Wikimedia can fail with a connection timeout
# with no apparent reason, likely an issue with their servers (https://releases.wikimedia.org/mediawiki/)
# hence we use github releases instead
# also note: this is for core only, it has no bundled exts
- name: Unarchive Mediawiki
  ansible.builtin.unarchive:
      src: "https://github.com/wikimedia/mediawiki/archive/refs/tags/{{ skeletons_pub.mediawiki_version }}.tar.gz"
      dest: "{{ paths.tenants.mediawiki_skeleton }}/app/public"
      remote_src: true
      owner: www-data
      group: www-data
      mode: "0775"
      creates: "{{ paths.tenants.mediawiki_skeleton }}/app/public/index.php"
      extra_opts: ["--strip-components=1"] # strip root version folder
  tags: ["skeleton", "mediawiki"]

- name: Update Mediawiki dependencies
  ansible.builtin.command:
      cmd: "composer update --no-dev"
      chdir: "{{ paths.tenants.mediawiki_skeleton }}/app/public"
      creates: "{{ paths.tenants.mediawiki_skeleton }}/app/public/composer.lock"
  become: true
  become_user: "www-data"
  tags: ["skeleton", "mediawiki"]

- name: Write modules.php file
  ansible.builtin.template:
      src: files/srv/skeleton/mediawiki/modules.php
      dest: "{{ paths.tenants.mediawiki_skeleton }}/app/public/modules.php"
      owner: "www-data"
      group: "www-data"
      mode: "0644"
  tags: ["skeleton", "mediawiki"]
