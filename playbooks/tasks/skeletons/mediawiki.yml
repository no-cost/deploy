---
- name: Setup common skeleton app structure
  ansible.builtin.include_tasks: ./helpers/common.yml
  vars:
      skeleton_root_dir: "{{ paths.tenants.mediawiki_skeleton }}"
  tags: [always]

- name: Install MediaWiki dependencies
  ansible.builtin.apt:
      name:
          - imagemagick
          - diffutils
      state: present
      update_cache: true
  tags: ["skeleton", "mediawiki"]

- name: Create hardlinks for MediaWiki binaries
  ansible.builtin.file:
      src: "{{ mw_hardlink.src }}"
      dest: "{{ mw_hardlink.dest }}"
      state: hard
      force: true
      owner: root
      group: root
      mode: "755"
  loop:
      - src: "/usr/bin/convert"
        dest: "{{ paths.tenants.mediawiki_skeleton }}/usr/bin/convert"
      - src: "/usr/bin/identify"
        dest: "{{ paths.tenants.mediawiki_skeleton }}/usr/bin/identify"
      - src: "/usr/bin/diff3"
        dest: "{{ paths.tenants.mediawiki_skeleton }}/usr/bin/diff3"
  loop_control:
      loop_var: mw_hardlink
  tags: ["skeleton", "chroot", "mediawiki"]

# https://www.mediawiki.org/wiki/Download
- name: Download & unarchive Mediawiki
  ansible.builtin.unarchive:
      remote_src: true
      src: "https://releases.wikimedia.org/mediawiki/{{ skeletons_pub.mediawiki_major + '/mediawiki-' + skeletons_pub.mediawiki_version + '.zip' }}"
      dest: /tmp/
      mode: "775"
  tags: ["skeleton", "mediawiki"]

- name: Ensure public dir
  ansible.builtin.file:
      path: "{{ paths.tenants.mediawiki_skeleton }}/app/public"
      state: directory
      owner: "www-data"
      group: "www-data"
      mode: "775"
  tags: ["skeleton", "mediawiki"]

- name: Move MediaWiki files to app directory
  ansible.builtin.shell:
      cmd: |
          mv /tmp/mediawiki-{{ skeletons_pub.mediawiki_version }}/* {{ (paths.tenants.mediawiki_skeleton + '/app/public/') | quote }}
          rm -r /tmp/mediawiki-{{ skeletons_pub.mediawiki_version }}
      creates: "{{ paths.tenants.mediawiki_skeleton }}/app/public/index.php"
  tags: ["skeleton", "mediawiki"]

# https://www.mediawiki.org/wiki/Manual:Installing_MediaWiki
# - name: Render mw-config
