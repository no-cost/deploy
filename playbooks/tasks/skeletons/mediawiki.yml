---
- name: Setup common skeleton app structure
  ansible.builtin.include_tasks: ./helpers/common.yml
  vars:
      skeleton_root_dir: "{{ paths.tenants.mediawiki_skeleton }}"
  tags: ["skeleton", "mediawiki"]

- name: Install MediaWiki dependencies
  ansible.builtin.apt:
      name:
          - imagemagick
          - diffutils
      state: present
      update_cache: true
  tags: ["skeleton", "mediawiki"]

- name: Create hardlinks for MediaWiki binaries
  ansible.builtin.file:
      src: "{{ mw_hardlink.src }}"
      dest: "{{ mw_hardlink.dest }}"
      state: hard
      force: true
      owner: root
      group: root
      mode: "755"
  loop:
      - src: "/usr/bin/diff3"
        dest: "{{ paths.tenants.mediawiki_skeleton }}/usr/bin/diff3"
  loop_control:
      loop_var: mw_hardlink
  tags: ["skeleton", "chroot", "mediawiki"]

- name: Create canonical hardlinks for ImageMagick
  ansible.builtin.include_tasks: ./helpers/canonical_hardlink.yml
  vars:
      hardlink_src: "/usr/bin/convert"
      hardlink_dest: "{{ paths.tenants.mediawiki_skeleton }}/usr/bin/convert"
      hardlink_root_dir: "{{ paths.tenants.mediawiki_skeleton }}"
  tags: ["skeleton", "mediawiki"]

