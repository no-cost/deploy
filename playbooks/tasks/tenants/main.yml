- name: Check if tenant already exists
  ansible.builtin.stat:
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}"
  register: tenant_exists

- name: Fail if tenant already exists
  ansible.builtin.fail:
      msg: "Tenant directory `{{ paths.tenants.root }}/{{ tenant_tag }}` already exists!"
  when: not force and tenant_exists.stat.exists

# TODO: check if tenant is "online" in main db

- name: Create tenant Linux user
  ansible.builtin.user:
      name: "tenant_{{ tenant_tag }}"
      shell: /sbin/nologin
      create_home: false

- name: Create base skeleton directory structure
  ansible.builtin.file:
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}/{{ tenant_rootdir }}"
      state: directory
      owner: "tenant_{{ tenant_tag }}"
      group: "tenant_{{ tenant_tag }}"
      mode: "755"
  loop:
      - app
      - etc
      - lib
      - logs
      - tmp
      - usr
  loop_control:
      loop_var: tenant_rootdir

- name: Create tenant database
  community.mysql.mysql_db:
      name: "tenant_{{ tenant_tag }}"
      encoding: utf8mb4
      collation: utf8mb4_unicode_ci
      login_unix_socket: /var/run/mysqld/mysqld.sock
      state: present

- name: Generate database password
  ansible.builtin.set_fact:
      db_password: "{{ tenant_db_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=20')) }}"

- name: Create database user for tenant
  community.mysql.mysql_user:
      name: "tenant_{{ tenant_tag }}"
      password: "{{ db_password }}"
      priv: "tenant_{{ tenant_tag }}.*:ALL"
      host: localhost
      login_unix_socket: /var/run/mysqld/mysqld.sock
      state: present

- name: Create PHP-FPM pool for tenant
  ansible.builtin.template:
      src: files/etc/php/fpm/pool-template.conf
      dest: /etc/php/fpm/pool.d/{{ tenant_tag }}.conf
      mode: "644"

- name: Check if vendor directory exists
  ansible.builtin.stat:
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}/app/vendor"
  register: vendor_dir

- name: Create mount point for vendor directory if it doesn't exist
  ansible.builtin.file:
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}/app/vendor"
      state: directory
      owner: "tenant_{{ tenant_tag }}"
      group: "tenant_{{ tenant_tag }}"
      mode: "755"
  when: not vendor_dir.stat.exists

- name: Mount vendor directory as read-only bind mount
  ansible.posix.mount:
      src: "{{ paths.tenants.skeleton_root }}/{{ service_type }}/app/vendor"
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}/app/vendor"
      opts: ro,bind
      state: mounted
      fstype: none

- name: Deploy application files
  block:
      - name: Deploy Flarum
        ansible.builtin.include_tasks: ./flarum/deploy.yml
        when: service_type == 'flarum'

      - name: Deploy WordPress
        ansible.builtin.include_tasks: ./wordpress/deploy.yml
        when: service_type == 'wordpress'

# TODO: recursively set owner and group to "tenant_{{ tenant_tag }}"
# listing all files and conditional "not path == 'vendor'" is very slow
# would be cool if the posix.synchronize module could set the owner of the synced files

- name: Create tenant configuration
  ansible.builtin.template:
      src: "./config.json"
      dest: "{{ paths.tenants.root }}/{{ tenant_tag }}/etc/config.json"
      owner: "tenant_{{ tenant_tag }}"
      group: "tenant_{{ tenant_tag }}"
      mode: "640"

# TODO: insert tenant record in database, check if already exists/is online

- name: Send welcome email
  community.general.mail:
      to: "{{ tenant_admin_email }}"
      subject: "Welcome to FreeFlarum!"
      body: |
          Your `{{ service_type }}` instance has been provisioned successfully!

          Domain: {{ tenant_tag }}.freeflarum.com
          Service: {{ service_type | capitalize }}

          If you have any questions, please let us know by replying to this e-mail.
      from: "noreply@{{ main_domain }}"
  failed_when: false

- name: Reload services
  ansible.builtin.systemd:
      name: "{{ web_service }}"
      state: reloaded
  loop:
      - "php{{ php_version }}-fpm"
      - nginx
  loop_control:
      loop_var: web_service
