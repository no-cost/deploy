---
# a helper to dynamically link vendor dir at different paths
- name: Check if vendor directory exists
  ansible.builtin.stat:
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}/{{ vendor_relative_path | default('app/vendor') }}"
  register: vendor_dir
  tags: ["skeleton", "chroot", "flarum", "mediawiki"]

- name: Create mount point for vendor directory if it doesn't exist
  ansible.builtin.file:
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}/{{ vendor_relative_path | default('app/vendor') }}"
      state: directory
      owner: "tenant_{{ tenant_tag }}"
      group: "tenant_{{ tenant_tag }}"
      mode: "755"
  when: not vendor_dir.stat.exists
  tags: ["skeleton", "chroot", "flarum", "mediawiki"]

- name: Mount vendor directory as read-only bind mount
  ansible.posix.mount:
      src: "{{ paths.tenants.skeleton_root }}/{{ service_type }}/{{ vendor_relative_path | default('app/vendor') }}"
      path: "{{ paths.tenants.root }}/{{ tenant_tag }}/{{ vendor_relative_path | default('app/vendor') }}"
      opts: ro,bind
      state: mounted
      fstype: none
  tags: ["skeleton", "chroot", "flarum", "mediawiki"]
