---
- name: Provision new tenant
  hosts: all
  gather_facts: false

  vars_files:
      - "public_vars.prod.yml"
      - "public_vars.{{ environment | default('dev') }}.yml"

  vars_prompt:
      - name: tenant_tag
        prompt: "Enter tenant tag (unique ID)"
        private: false

      - name: service_type
        prompt: "Enter service type (`flarum` / `wordpress` / `mediawiki`)"
        private: false

      - name: tenant_admin_email
        prompt: "Enter tenant admin's e-mail (used to send password reset e-mail)"
        private: false

  tasks:
      - name: Check if tenant already exists
        ansible.builtin.stat:
            path: "{{ paths.tenants.root }}/{{ tenant_tag }}"
        register: tenant_exists

      - name: Fail if tenant already exists
        ansible.builtin.fail:
            msg: "Tenant directory `{{ paths.tenants.root }}/{{ tenant_tag }}` already exists!"
        when: tenant_exists.stat.exists

      # TODO: check if tenant is "online" in main db

      - name: Create tenant Linux user
        ansible.builtin.user:
            name: "tenant_{{ tenant_tag }}"
            shell: /sbin/nologin
            create_home: false

      - name: Create skeleton directory structure
        ansible.builtin.file:
            path: "{{ paths.tenants.root }}/{{ tenant_tag }}/{{ item }}"
            state: directory
            owner: "tenant_{{ tenant_tag }}"
            group: "tenant_{{ tenant_tag }}"
            mode: "755"
        loop:
            - app
            - etc
            - lib
            - logs
            - public
            - tmp
            - usr

      - name: Create tenant database
        community.mysql.mysql_db:
            name: "tenant_{{ tenant_tag }}"
            encoding: utf8mb4
            collation: utf8mb4_unicode_ci
            login_unix_socket: /var/run/mysqld/mysqld.sock
            state: present

      - name: Generate database password
        ansible.builtin.set_fact:
            db_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=20') }}"

      - name: Create database user for tenant
        community.mysql.mysql_user:
            name: "tenant_{{ tenant_tag }}"
            password: "{{ db_password }}"
            priv: "tenant_{{ tenant_tag }}.*:ALL"
            host: localhost
            login_unix_socket: /var/run/mysqld/mysqld.sock
            state: present

      - name: Create PHP-FPM pool for tenant
        ansible.builtin.template:
            src: files/etc/php/fpm/pool-template.conf
            dest: /etc/php/fpm/pool.d/{{ tenant_tag }}.conf
            mode: "644"

      - name: Copy skeleton directory structure
        ansible.posix.synchronize:
            src: "{{ paths.tenants.skeleton_root }}/{{ service_type }}"
            dest: "{{ paths.tenants.root }}/{{ tenant_id }}/"
            rsync_opts:
                - "--exclude=/etc/config.json"
                - "--exclude=/app/vendor"
            recursive: true

      - name: Render config.json template with tenant information
        ansible.builtin.template:
            src: files/srv/skeleton/flarum/etc/config.json
            dest: "{{ paths.tenants.root }}/{{ tenant_id }}/etc/config.json"
            owner: "tenant_{{ tenant_tag }}"
            group: "tenant_{{ tenant_tag }}"
            mode: "644"

      - name: Create mount point for vendor directory if it doesn't exist
        ansible.builtin.file:
            path: "{{ paths.tenants.root }}/{{ tenant_id }}/app/vendor"
            state: directory
            owner: "tenant_{{ tenant_tag }}"
            group: "tenant_{{ tenant_tag }}"
            mode: "755"

      - name: Mount vendor directory as read-only bind mount
        ansible.posix.mount:
            path: "{{ paths.tenants.root }}/{{ tenant_id }}/app/vendor"
            src: "{{ paths.tenants.skeleton_root }}/{{ service_type }}/app/vendor"
            opts: ro,bind
            state: mounted
            fstype: none

      - name: Set ownership and permissions for tenant directory
        ansible.builtin.file:
            path: "{{ paths.tenants.root }}/{{ tenant_id }}"
            owner: "tenant_{{ tenant_tag }}"
            group: "tenant_{{ tenant_tag }}"
            recurse: true
            state: directory

      - name: Deploy application files
        block:
            - name: Deploy Flarum
              ansible.builtin.include_tasks: ./flarum/deploy.yml
              when: service_type == 'flarum'

            - name: Deploy WordPress
              ansible.builtin.include_tasks: ./wordpress/deploy.yml
              when: service_type == 'wordpress'

      - name: Create tenant configuration
        ansible.builtin.template:
            src: "./config.json"
            dest: "{{ paths.tenants.root }}/{{ tenant_tag }}/etc/config.json"
            owner: "tenant_{{ tenant_tag }}"
            group: "tenant_{{ tenant_tag }}"
            mode: "640"

      # TODO: insert tenant record in database, check if already exists/is online

      - name: Send welcome email
        ansible.builtin.mail:
            to: "{{ tenant_admin_email }}"
            subject: "Welcome to FreeFlarum!"
            body: |
                Your `{{ service_type }}` instance has been provisioned successfully!

                Domain: {{ tenant_tag }}.freeflarum.com
                Service: {{ service_type | capitalize }}

                If you have any questions, please let us know by replying to this e-mail.
            from: noreply@{{ main_domain  }}
        ignore_errors: true

      - name: Reload services
        ansible.builtin.systemd:
            name: "{{ item }}"
            state: reload
        loop:
            - "php{{ php_version }}-fpm"
            - nginx
