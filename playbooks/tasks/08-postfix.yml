---
- name: Install mail packages
  ansible.builtin.apt:
      name:
          - postfix
          - postfix-pcre
          - opendkim
          - opendkim-tools
          - opendmarc
          - postgrey
          - spamc
      state: present
  tags: ["email", "mail", "postfix"]

# spamassassin was renamed to spamd in Ubuntu 24.04
- name: Install SpamAssassin (Ubuntu < 24.04)
  ansible.builtin.apt:
      name: spamassassin
      state: present
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '<')
  tags: ["email", "mail", "postfix"]

- name: Install SpamAssassin (Ubuntu >= 24.04)
  ansible.builtin.apt:
      name: spamd
      state: present
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>=')
  tags: ["email", "mail", "postfix"]

- name: Configure Postfix main.cf
  ansible.builtin.template:
      src: files/etc/postfix/main.cf
      dest: /etc/postfix/main.cf
      mode: "644"
  tags: ["email", "mail", "postfix"]

- name: Configure Postfix master.cf
  ansible.builtin.template:
      src: files/etc/postfix/master.cf
      dest: /etc/postfix/master.cf
      mode: "644"
  tags: ["email", "mail", "postfix"]

- name: Create virtual mailbox domains
  ansible.builtin.template:
      src: files/etc/postfix/virtual
      dest: /etc/postfix/virtual
      mode: "644"
  notify: postmap postfix_virtual
  tags: ["email", "mail", "postfix"]

- name: Create sender access file
  ansible.builtin.template:
      src: files/etc/postfix/sender_access
      dest: /etc/postfix/sender_access
      mode: "644"
  notify: postmap postfix_sender_access

- name: Configure OpenDKIM
  ansible.builtin.template:
      src: files/etc/opendkim.conf
      dest: /etc/opendkim.conf
      mode: "644"
  tags: ["email", "mail", "postfix"]

- name: Create OpenDKIM keys directory
  ansible.builtin.file:
      path: /etc/opendkim/keys
      state: directory
      owner: opendkim
      group: opendkim
      mode: "700"
  tags: ["email", "mail", "postfix"]

- name: Create OpenDKIM main domain key directory
  ansible.builtin.file:
      path: "/etc/opendkim/keys/{{ main_domain }}"
      state: directory
      owner: opendkim
      group: opendkim
      mode: "700"
  tags: ["email", "mail", "postfix"]

- name: Copy OpenDKIM mail.private for main domain
  ansible.builtin.copy:
      dest: "/etc/opendkim/keys/{{ main_domain }}/mail.private"
      content: "{{ postfix.opendkim_domain_key }}"
      owner: opendkim
      group: opendkim
      mode: "644"
  tags: ["email", "mail", "postfix"]

- name: Copy OpenDKIM mail.txt for main domain
  ansible.builtin.copy:
      dest: "/etc/opendkim/keys/{{ main_domain }}/mail.txt"
      content: "{{ postfix.opendkim_dns_txt }}"
      owner: opendkim
      group: opendkim
      mode: "644"
  tags: ["email", "mail", "postfix"]

- name: Render OpenDKIM tables
  ansible.builtin.template:
      dest: "{{ dkim_table }}"
      src: "files{{ dkim_table }}"
      owner: opendkim
      group: opendkim
      mode: "644"
  loop:
      - /etc/opendkim/KeyTable
      - /etc/opendkim/SigningTable
      - /etc/opendkim/TrustedHosts
  loop_control:
      loop_var: dkim_table
  notify: restart opendkim
  tags: ["email", "mail", "postfix"]

- name: Configure SpamAssassin
  ansible.builtin.template:
      src: files/etc/spamassassin/local.cf
      dest: /etc/spamassassin/local.cf
      mode: "644"
  notify: restart spamassassin

- name: Configure Postgrey
  ansible.builtin.template:
      src: files/etc/default/postgrey
      dest: /etc/default/postgrey
      mode: "644"
  notify: restart postgrey

- name: Set up mail log rotation
  ansible.builtin.copy:
      src: files/etc/logrotate.d/postfix
      dest: /etc/logrotate.d/postfix
      mode: "644"

- name: Enable and start mail services (except SpamAssassin)
  ansible.builtin.systemd:
      name: "{{ mail_service }}"
      enabled: true
      state: started
  loop:
      - postfix
      - opendkim
      - opendmarc
      - postgrey
  loop_control:
      loop_var: mail_service

- name: Enable and start SpamAssassin service (Ubuntu < 24.04)
  ansible.builtin.systemd:
      name: spamassassin
      enabled: true
      state: started
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '<')

- name: Enable and start SpamAssassin service (Ubuntu >= 24.04)
  ansible.builtin.systemd:
      name: spamd
      enabled: true
      state: started
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>=')
