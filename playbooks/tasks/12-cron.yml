---
- name: Set up system cron jobs
  ansible.builtin.cron:
      name: "{{ job.name }}"
      minute: "{{ job.minute }}"
      hour: "{{ job.hour }}"
      day: "{{ job.day | default('*') }}"
      weekday: "{{ job.weekday | default('*') }}"
      job: "{{ job.job }}"
      user: "{{ job.user | default('root') }}"
      state: present
  loop:
      - name: "Flarum log cleanup"
        minute: "0"
        hour: "3"
        weekday: "0"
        job: "/bin/rm {{ paths.tenants.root }}/app/storage/logs/flarum*.log >> /var/log/cron/flarum-log-cleanup.log 2>&1"
  loop_control:
      loop_var: job
  tags: ["cron"]

- name: Create cron log directory
  ansible.builtin.file:
      path: /var/log/cron
      state: directory
      mode: "755"
  tags: ["cron"]

- name: Configure cron log rotation
  ansible.builtin.copy:
      dest: /etc/logrotate.d/cron-scripts
      src: files/etc/logrotate.d/cron-scripts
      mode: "644"
  tags: ["cron"]
