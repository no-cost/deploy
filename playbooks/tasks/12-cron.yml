---
- name: Set up system cron jobs
  ansible.builtin.cron:
      name: "{{ job.name }}"
      minute: "{{ job.minute }}"
      hour: "{{ job.hour }}"
      day: "{{ job.day | default('*') }}"
      weekday: "{{ job.weekday | default('*') }}"
      job: "{{ job.job }}"
      user: "{{ job.user | default('root') }}"
      state: present
  loop:
      - name: "Mail the fail2ban bans of the last week"
        minute: "0"
        hour: "7"
        weekday: "1"
        job: "/usr/local/bin/fail2ban-weekly-report"
      - name: "Run geoipupdate"
        minute: "0"
        hour: "0"
        day: "1"
        job: "/usr/bin/geoipupdate"
      - name: "Backup all tenant sites (periodic, 7-day retention)"
        minute: "0"
        hour: "23"
        job: >-
            PATH={{ paths.backend_bin_root }}:$PATH
            {{ paths.backend_bin_root }}/backup_site --delete-older-than 7
            >> /var/log/cron/backup-sites.log 2>&1
      - name: "Backup system directories (7-day retention)"
        minute: "0"
        hour: "22"
        job: >-
            PATH={{ paths.backend_bin_root }}:$PATH
            {{ paths.backend_bin_root }}/backup_system --delete-older-than 7
            >> /var/log/cron/backup-system.log 2>&1
      - name: "Collect tenant site stats (weekly)"
        minute: "0"
        hour: "4"
        weekday: "7"
        job: >-
            PATH={{ paths.backend_bin_root }}:$PATH
            {{ paths.backend_bin_root }}/collect_stats
            >> /var/log/cron/collect-stats.log 2>&1
      # Flarum's LESS compiler caches every parsed .less file in each forum's storage/less (tens of MB per compile
      # and forum, every color scheme separately) and prunes only files older than 7 days, on its next compile.
      # The cache only helps within one compile, so anything older than 10 minutes goes.
      - name: "Purge Flarum LESS caches (every 10 minutes)"
        minute: "*/10"
        hour: "*"
        job: >-
            ionice -c 3 nice -n 19 find {{ paths.tenants.root }}/*/app/storage/less -maxdepth 1 -type f
            \( -name '*.lesscache' -o -name 'lesscache_*' \) -mmin +10 -delete 2>/dev/null
      # Flarum writes one log file per forum and day (storage/logs/flarum-YYYY-MM-DD.log, Monolog's
      # RotatingFileHandler without a file limit) and never deletes them
      - name: "Purge Flarum logs older than 30 days (daily)"
        minute: "30"
        hour: "3"
        job: >-
            ionice -c 3 nice -n 19 find {{ paths.tenants.root }}/*/app/storage/logs -maxdepth 1 -type f
            -name 'flarum-*.log' -mtime +30 -delete 2>/dev/null
  loop_control:
      loop_var: job
  tags: ["cron"]

- name: Ensure cron log directory
  ansible.builtin.file:
      path: /var/log/cron
      state: directory
      mode: "0755"
  tags: ["cron"]

- name: Configure cron log rotation
  ansible.builtin.copy:
      dest: /etc/logrotate.d/cron-scripts
      src: files/etc/logrotate.d/cron-scripts
      mode: "0644"
  tags: ["cron"]
