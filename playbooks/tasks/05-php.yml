---
- name: Add PHP repository
  ansible.builtin.apt_repository:
      repo: "ppa:ondrej/php"
      state: present
      update_cache: true
  tags: ["php-fpm", "php"]

- name: Install PHP-FPM and extensions
  ansible.builtin.apt:
      name:
          - "php{{ php_version }}-fpm"
          - "php{{ php_version }}-cli"
          - "php{{ php_version }}-common"
          - "php{{ php_version }}-mysql"
          - "php{{ php_version }}-sqlite3"
          - "php{{ php_version }}-xml"
          - "php{{ php_version }}-curl"
          - "php{{ php_version }}-gd"
          - "php{{ php_version }}-imagick"
          - "php{{ php_version }}-mbstring"
          - "php{{ php_version }}-zip"
          - "php{{ php_version }}-bcmath"
          - "php{{ php_version }}-intl"
          - "php{{ php_version }}-apcu"
          - "php{{ php_version }}-readline"
          - "php{{ php_version }}-ldap"
          - "php{{ php_version }}-exif"
      state: present
  tags: ["php-fpm", "php"]

- name: Symlink configuration directory
  ansible.builtin.file:
      src: /etc/php/{{ php_version }}/fpm
      dest: /etc/php/fpm
      state: link
      follow: false
      force: true
  tags: ["php-fpm", "php"]

- name: Configure PHP-FPM
  ansible.builtin.template:
      src: "files{{ php_conf }}"
      dest: "{{ php_conf }}"
      mode: "644"
  loop:
      - /etc/php/fpm/php-fpm.conf
      - /etc/php/fpm/php.ini
      - /etc/php/fpm/base-pool.conf
  loop_control:
      loop_var: php_conf
  notify: restart php-fpm
  tags: ["php-fpm", "php"]

- name: Suppress deprecation warnings for PHP CLI, to not spam wp-cli output etc.
  ansible.builtin.lineinfile:
      path: "/etc/php/{{ php_version }}/cli/php.ini"
      regexp: "^error_reporting\\s*="
      line: "error_reporting = E_ALL & ~E_DEPRECATED"
  tags: ["php"]

- name: Remove default www pool
  ansible.builtin.file:
      path: "/etc/php/fpm/pool.d/www.conf"
      state: absent
  tags: ["php-fpm", "php"]

- name: Ensure PHP-FPM override directory exists
  ansible.builtin.file:
      path: /etc/systemd/system/php{{ php_version }}-fpm.service.d
      state: directory
      mode: "644"
  tags: ["php-fpm", "php"]

- name: Configure PHP-FPM systemd override
  ansible.builtin.template:
      src: files/etc/systemd/system/php-fpm.service.d/override.conf
      dest: "/etc/systemd/system/php{{ php_version }}-fpm.service.d/override.conf"
      mode: "644"
  notify:
      - daemon reload
      - restart php-fpm
  tags: ["php-fpm", "php"]

- name: Ensure PHP-FPM log directory
  ansible.builtin.file:
      path: /var/log/php
      state: directory
      owner: www-data
      group: www-data
      mode: "755"
  tags: ["php-fpm", "php"]

- name: Ensure mods-available directory exists
  ansible.builtin.file:
      path: /etc/php/mods-available
      state: directory
      mode: "644"
  tags: ["php-fpm", "php"]

- name: Configure OPcache for production
  ansible.builtin.copy:
      src: files/etc/php/mods-available/opcache.ini
      dest: /etc/php/mods-available/opcache.ini
      mode: "644"
  notify: restart php-fpm
  tags: ["php-fpm", "php"]

- name: Start and enable PHP-FPM service
  ansible.builtin.systemd:
      name: "php{{ php_version }}-fpm"
      enabled: true
      state: started
      daemon_reload: true
  tags: ["php-fpm", "php"]
