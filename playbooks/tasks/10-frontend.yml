---
- name: Get latest frontend dist release
  ansible.builtin.get_url:
      url: "https://github.com/no-cost/frontend/releases/latest/download/dist.zip"
      dest: "/tmp/nocost-frontend.zip"
      mode: "0644"
  tags: ["nocost", "frontend"]

- name: Extract frontend dist release
  ansible.builtin.unarchive:
      src: "/tmp/nocost-frontend.zip"
      dest: "{{ paths.frontend_root }}"
      owner: www-data
      group: www-data
      mode: "0755"
  tags: ["nocost", "frontend"]
