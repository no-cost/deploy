---
- name: Ensure local build directory
  ansible.builtin.tempfile:
      state: directory
      prefix: nocost_frontend_
  delegate_to: localhost
  register: _frontend_build_dir
  tags: ["nocost", "frontend"]

- name: Remove temp dir so git clone can (re)create it
  ansible.builtin.file:
      path: "{{ _frontend_build_dir.path }}"
      state: absent
  delegate_to: localhost
  tags: ["nocost", "frontend"]

- name: Clone frontend repo
  ansible.builtin.git:
      repo: "https://github.com/no-cost/frontend.git"
      dest: "{{ _frontend_build_dir.path }}"
      version: master
      depth: 1
  delegate_to: localhost
  tags: ["nocost", "frontend"]

- name: Render .env for frontend build
  ansible.builtin.template:
      src: "{{ playbook_dir }}/files/srv/frontend/.env.template"
      dest: "{{ _frontend_build_dir.path }}/.env"
  delegate_to: localhost
  tags: ["nocost", "frontend"]

- name: Install dependencies
  ansible.builtin.command:
      cmd: bun install
      chdir: "{{ _frontend_build_dir.path }}"
  delegate_to: localhost
  changed_when: true
  tags: ["nocost", "frontend"]

- name: Build frontend
  ansible.builtin.command:
      cmd: bun run build
      chdir: "{{ _frontend_build_dir.path }}"
  delegate_to: localhost
  changed_when: true
  tags: ["nocost", "frontend"]

- name: Ensure frontend root directory exists
  ansible.builtin.file:
      path: "{{ paths.frontend_root }}"
      state: directory
      owner: www-data
      group: www-data
      mode: "0755"
  tags: ["nocost", "frontend"]

- name: Sync built frontend to server
  ansible.posix.synchronize:
      src: "{{ _frontend_build_dir.path }}/dist/"
      dest: "{{ paths.frontend_root }}/"
      delete: true
      recursive: true
  tags: ["nocost", "frontend"]

- name: Set frontend perms
  ansible.builtin.file:
      path: "{{ paths.frontend_root }}"
      state: directory
      owner: www-data
      group: www-data
      mode: "0755"
      recurse: true
  tags: ["nocost", "frontend"]
