---
- name: Ensure frontend root directory exists
  ansible.builtin.file:
      path: "{{ paths.frontend_root }}"
      state: directory
      owner: www-data
      group: www-data
      mode: "0755"
  tags: ["nocost", "frontend"]

- name: Extract frontend master branch
  ansible.builtin.unarchive:
      src: "https://github.com/no-cost/frontend/archive/refs/heads/master.zip"
      remote_src: true
      dest: "/tmp"
  tags: ["nocost", "frontend"]

- name: Sync frontend
  ansible.builtin.shell:
      cmd: "rsync -a --delete /tmp/frontend-master/ {{ paths.frontend_root }}/"
  changed_when: true
  tags: ["nocost", "frontend"]

- name: Set frontend perms
  ansible.builtin.file:
      path: "{{ paths.frontend_root }}"
      state: directory
      owner: www-data
      group: www-data
      mode: "0755"
      recurse: true
  tags: ["nocost", "frontend"]

- name: Remove tmp extracted frontend
  ansible.builtin.file:
      path: "/tmp/frontend-master"
      state: absent
  tags: ["nocost", "frontend"]
