---
- name: Install monitoring tools
  ansible.builtin.apt:
      name:
          - htop
          - iotop
          - iftop
          - sysstat
          - ncdu
          - vnstat
          - monit
      state: present
      update_cache: true
  tags: ["monitoring"]

- name: Enable and start sysstat
  ansible.builtin.systemd:
      name: sysstat
      enabled: true
      state: restarted
  tags: ["monitoring"]

- name: Enable and start vnstat
  ansible.builtin.systemd:
      name: vnstat
      enabled: true
      state: restarted
  tags: ["monitoring"]

- name: Configure Monit
  ansible.builtin.template:
      src: files/etc/monit/monitrc
      dest: /etc/monit/monitrc
      owner: root
      group: root
      mode: "0600"
  notify: restart monit
  tags: ["monitoring"]

- name: Ensure Monit service configurations
  ansible.builtin.template:
      src: "files/etc/monit/conf.d/{{ monit_service }}"
      dest: "/etc/monit/conf.d/{{ monit_service }}"
      owner: root
      group: root
      mode: "0644"
  loop:
      - nginx
      - php-fpm
      - mariadb
      - postfix
      - disk
      - nocost
      - system
  loop_control:
      loop_var: monit_service
  notify: restart monit
  tags: ["monitoring"]

- name: Start and enable monit
  ansible.builtin.systemd:
      name: monit
      enabled: true
      state: restarted
  tags: ["monitoring"]
