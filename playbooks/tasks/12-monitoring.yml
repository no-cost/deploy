---
- name: Install monitoring tools
  ansible.builtin.apt:
      name:
          - iotop
          - iftop
          - sysstat
          - ncdu
          - vnstat
          - logwatch
          - monit
      state: present
      update_cache: true

- name: Enable and start sysstat
  ansible.builtin.systemd:
      name: sysstat
      enabled: true
      state: started

- name: Enable and start vnstat
  ansible.builtin.systemd:
      name: vnstat
      enabled: true
      state: started

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
      content: |
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 3
          bantime = 3600
          findtime = 600
      dest: /etc/fail2ban/jail.local
      owner: root
      group: root
      mode: "644"
  notify: restart fail2ban

- name: Configure fail2ban for Nginx
  ansible.builtin.copy:
      content: |
          [nginx-http-auth]
          enabled = true
          filter = nginx-http-auth
          port = http,https
          logpath = /var/log/nginx/error.log
          maxretry = 3
          bantime = 3600

          [nginx-noscript]
          enabled = true
          port = http,https
          filter = nginx-noscript
          logpath = /var/log/nginx/access.log
          maxretry = 3
          bantime = 3600

          [nginx-badbots]
          enabled = true
          port = http,https
          filter = nginx-badbots
          logpath = /var/log/nginx/access.log
          maxretry = 2
          bantime = 86400

          [nginx-noproxy]
          enabled = true
          port = http,https
          filter = nginx-noproxy
          logpath = /var/log/nginx/error.log
          maxretry = 2
          bantime = 86400
      dest: /etc/fail2ban/jail.d/nginx.conf
      owner: root
      group: root
      mode: "644"
  notify: restart fail2ban

- name: Start and enable fail2ban
  ansible.builtin.systemd:
      name: fail2ban
      enabled: true
      state: started

- name: Configure Monit
  ansible.builtin.template:
      src: files/etc/monit/monitrc
      dest: /etc/monit/monitrc
      owner: root
      group: root
      mode: "600"
  notify: restart monit

- name: Create Monit service configurations
  ansible.builtin.template:
      src: "files/etc/monit/conf.d/{{ item }}"
      dest: "/etc/monit/conf.d/{{ item }}"
      owner: root
      group: root
      mode: "644"
  loop:
      - nginx
      - php-fpm
      - mariadb
      - postfix
      - disk
      - system
  notify: restart monit

- name: Create system monitoring script
  ansible.builtin.copy:
      content: |
          #!/bin/bash
          # FreeFlarum System Monitoring

          echo "=== FreeFlarum System Health Report ==="
          echo "Generated: $(date)"
          echo ""

          echo "=== Disk Usage ==="
          df -h | grep -E '^/dev/'
          echo ""

          echo "=== Memory Usage ==="
          free -h
          echo ""

          echo "=== Top Processes by CPU ==="
          ps aux | sort -nrk 3,3 | head -10
          echo ""

          echo "=== Top Processes by Memory ==="
          ps aux | sort -nrk 4,4 | head -10
          echo ""

          echo "=== Service Status ==="
          systemctl status nginx --no-pager | head -3
          systemctl status php{{ php_version }}-fpm --no-pager | head -3
          systemctl status mariadb --no-pager | head -3
          systemctl status postfix --no-pager | head -3
          echo ""

          echo "=== Site Count ==="
          if [ -d "{{ paths.tenants.root }}" ]; then
              total_sites=$(find {{ paths.tenants.root }} -maxdepth 1 -type d | wc -l)
              echo "Total sites: $((total_sites - 1))"

              # Count by service type
              for service in {{ available_services | join(' ') }}; do
                  count=$(find {{ paths.tenants.root }} -maxdepth 2 -path "*/etc/config.json" -exec grep -l "\"service\": \"$service\"" {} \; | wc -l)
                  echo "$service sites: $count"
              done
          fi
          echo ""

          echo "=== Recent Errors ==="
          echo "Nginx errors (last 10):"
          tail -10 /var/log/nginx/error.log 2>/dev/null || echo "No nginx error log"
          echo ""
          echo "PHP errors (last 10):"
          tail -10 /var/log/php{{ php_version }}-fpm.log 2>/dev/null || echo "No PHP error log"
          echo ""

          echo "=== Fail2ban Status ==="
          fail2ban-client status | grep "Jail list" || echo "Fail2ban not running"
          echo ""

          echo "=== Network Connections ==="
          netstat -tuln | grep LISTEN
          echo ""

          echo "=== Load Average ==="
          uptime
      dest: /usr/local/bin/freeflarum-monitor
      owner: root
      group: root
      mode: "755"

- name: Set up daily monitoring report
  ansible.builtin.cron:
      name: "FreeFlarum daily monitoring report"
      minute: "0"
      hour: "8"
      job: "/usr/local/bin/freeflarum-monitor | mail -s 'FreeFlarum Daily Health Report' root"
      user: root
      state: present

- name: Create alert script for critical issues
  ansible.builtin.copy:
      content: |
          #!/bin/bash
          # FreeFlarum Critical Alert Monitor

          ALERT=0
          ALERT_MSG=""

          # Check disk space (alert if >90% used)
          DISK_USAGE=$(df / | awk 'NR==2 {print int($5)}')
          if [ "$DISK_USAGE" -gt 90 ]; then
              ALERT=1
              ALERT_MSG="$ALERT_MSG\nCRITICAL: Root disk usage is ${DISK_USAGE}%"
          fi

          # Check backup disk if exists
          if mountpoint -q {{ paths.backup_root }}; then
              BACKUP_USAGE=$(df {{ paths.backup_root }} | awk 'NR==2 {print int($5)}')
              if [ "$BACKUP_USAGE" -gt 90 ]; then
                  ALERT=1
                  ALERT_MSG="$ALERT_MSG\nCRITICAL: Backup disk usage is ${BACKUP_USAGE}%"
              fi
          fi

          # Check memory (alert if <10% free)
          MEM_FREE=$(free | awk 'NR==2 {print int($7/$2 * 100)}')
          if [ "$MEM_FREE" -lt 10 ]; then
              ALERT=1
              ALERT_MSG="$ALERT_MSG\nCRITICAL: Only ${MEM_FREE}% memory available"
          fi

          # Check load average
          LOAD=$(uptime | awk -F'load average:' '{print $2}' | awk '{print $1}' | cut -d, -f1)
          CORES=$(nproc)
          if [ $(echo "$LOAD > $CORES * 2" | bc -l) -eq 1 ]; then
              ALERT=1
              ALERT_MSG="$ALERT_MSG\nCRITICAL: High load average: $LOAD (${CORES} cores)"
          fi

          # Check critical services
          for service in nginx php{{ php_version }}-fpm mariadb; do
              if ! systemctl is-active --quiet $service; then
                  ALERT=1
                  ALERT_MSG="$ALERT_MSG\nCRITICAL: Service $service is not running"
              fi
          done

          # Send alert if needed
          if [ "$ALERT" -eq 1 ]; then
              echo -e "FreeFlarum Critical Alert\n$ALERT_MSG" | mail -s "CRITICAL: FreeFlarum Alert" root
          fi
      dest: /usr/local/bin/freeflarum-alert
      owner: root
      group: root
      mode: "755"

- name: Set up critical alert monitoring (every 30 minutes)
  ansible.builtin.cron:
      name: "FreeFlarum critical alerts"
      minute: "*/30"
      job: "/usr/local/bin/freeflarum-alert"
      user: root
      state: present

- name: Configure logwatch
  ansible.builtin.copy:
      content: |
          # FreeFlarum Logwatch configuration
          Output = mail
          Format = html
          MailTo = root
          MailFrom = Logwatch <logwatch@{{ ansible_hostname }}>
          Range = yesterday
          Detail = Med
          Service = All
          Service = "-zz-network"
          Service = "-zz-sys"
      dest: /etc/logwatch/conf/logwatch.conf
      owner: root
      group: root
      mode: "644"

- name: Start and enable monit
  ansible.builtin.systemd:
      name: monit
      enabled: true
      state: started
