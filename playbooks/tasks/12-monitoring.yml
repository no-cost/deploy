---
- name: Install monitoring tools
  ansible.builtin.apt:
      name:
          - htop
          - iotop
          - iftop
          - sysstat
          - ncdu
          - vnstat
          - logwatch
          - monit
      state: present
      update_cache: true

- name: Enable and start sysstat
  ansible.builtin.systemd:
      name: sysstat
      enabled: true
      state: started

- name: Enable and start vnstat
  ansible.builtin.systemd:
      name: vnstat
      enabled: true
      state: started

- name: Configure Monit
  ansible.builtin.template:
      src: files/etc/monit/monitrc
      dest: /etc/monit/monitrc
      owner: root
      group: root
      mode: "600"
  notify: restart monit

- name: Create Monit service configurations
  ansible.builtin.template:
      src: "files/etc/monit/conf.d/{{ item }}"
      dest: "/etc/monit/conf.d/{{ item }}"
      owner: root
      group: root
      mode: "644"
  loop:
      - nginx
      - php-fpm
      - mariadb
      - postfix
      - disk
      - system
  notify: restart monit

- name: Start and enable monit
  ansible.builtin.systemd:
      name: monit
      enabled: true
      state: started
