---
- name: Run unit tests
  ansible.builtin.command:
      cmd: ".venv/bin/python -m pytest tests/ -v"
      chdir: "{{ paths.backend_root }}"
  become: true
  become_user: nocost
  changed_when: false
  tags: ["tests", "unit"]

- name: "Run integration lifecycle test"
  ansible.builtin.include_tasks: integration_tests/_lifecycle.yml
  vars:
      api_base: "https://api.{{ main_domain }}"
  loop: "{{ public_services }}"
  loop_control:
      loop_var: site_type
  tags: ["tests", "integration"]
