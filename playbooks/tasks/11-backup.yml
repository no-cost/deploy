---
- name: Create backup directories
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: root
      group: root
      mode: "755"
  loop:
      - "{{ paths.backup_root }}"
      - "{{ paths.backup_host_root }}"
      - "{{ paths.backup_attic_root }}"
      - "{{ paths.backup_attic_root }}/flarum"
      - "{{ paths.backup_attic_root }}/wordpress"

- name: Install backup dependencies
  ansible.builtin.apt:
      name:
          - xz-utils
      state: present
      update_cache: yes

- name: Create backup user
  ansible.builtin.user:
      name: backup
      system: yes
      shell: /bin/bash
      home: /var/lib/backup
      create_home: yes
      state: present

- name: Create MySQL backup user
  community.mysql.mysql_user:
      name: backup
      password: "{{ mariadb.backup_password }}"
      priv: "*.*:SELECT,LOCK TABLES,SHOW VIEW,EVENT,TRIGGER"
      host: localhost
      state: present
      login_user: root
      login_password: "{{ mariadb.root_password }}"

- name: Create backup scripts directory
  ansible.builtin.file:
      path: /usr/local/bin/freeflarum-backup
      state: directory
      owner: root
      group: root
      mode: "755"

- name: Deploy backup script
  ansible.builtin.template:
      src: files/usr/local/bin/freeflarum-backup/backup-site.sh
      dest: /usr/local/bin/freeflarum-backup/backup-site.sh
      owner: root
      group: root
      mode: "755"

- name: Deploy archive script
  ansible.builtin.template:
      src: files/usr/local/bin/freeflarum-backup/archive-site.sh
      dest: /usr/local/bin/freeflarum-backup/archive-site.sh
      owner: root
      group: root
      mode: "755"

- name: Deploy cleanup script
  ansible.builtin.template:
      src: files/usr/local/bin/freeflarum-backup/cleanup.sh
      dest: /usr/local/bin/freeflarum-backup/cleanup.sh
      owner: root
      group: root
      mode: "755"

- name: Create backup wrapper script
  ansible.builtin.copy:
      content: |
          #!/bin/bash
          # FreeFlarum backup wrapper

          BACKUP_CMD="/srv/freeflarum/bin/backup"
          LOG_FILE="/var/log/freeflarum-backup.log"

          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Starting backup process" >> "$LOG_FILE"

          if [ -x "$BACKUP_CMD" ]; then
              $BACKUP_CMD "$@" >> "$LOG_FILE" 2>&1
              EXIT_CODE=$?
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Backup completed with exit code: $EXIT_CODE" >> "$LOG_FILE"
          else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] ERROR: Backup command not found at $BACKUP_CMD" >> "$LOG_FILE"
              exit 1
          fi

          # Run cleanup for backups older than 30 days
          /usr/local/bin/freeflarum-backup/cleanup.sh 30 >> "$LOG_FILE" 2>&1
      dest: /usr/local/bin/freeflarum-backup-wrapper
      owner: root
      group: root
      mode: "755"

- name: Set up daily backup cron job
  ansible.builtin.cron:
      name: "FreeFlarum daily backup"
      minute: "0"
      hour: "3"
      job: "/usr/local/bin/freeflarum-backup-wrapper"
      user: root
      state: present

- name: Set up weekly full backup cron job
  ansible.builtin.cron:
      name: "FreeFlarum weekly full backup"
      minute: "0"
      hour: "4"
      weekday: "0"
      job: "/usr/local/bin/freeflarum-backup-wrapper --full"
      user: root
      state: present

- name: Create backup monitoring script
  ansible.builtin.copy:
      content: |
          #!/bin/bash
          # Check if backups are recent

          BACKUP_DIR="{{ paths.backup_host_root }}"
          MAX_AGE_HOURS=26  # Alert if no backup in 26 hours

          for site_dir in "$BACKUP_DIR"/*; do
              if [ -d "$site_dir" ]; then
                  site_name=$(basename "$site_dir")
                  latest_backup=$(find "$site_dir" -maxdepth 1 -type d -name "20*" | sort -r | head -1)
                  
                  if [ -z "$latest_backup" ]; then
                      echo "WARNING: No backups found for site: $site_name"
                      continue
                  fi
                  
                  backup_date=$(basename "$latest_backup")
                  backup_timestamp=$(date -d "$backup_date" +%s 2>/dev/null)
                  current_timestamp=$(date +%s)
                  age_hours=$(( (current_timestamp - backup_timestamp) / 3600 ))
                  
                  if [ "$age_hours" -gt "$MAX_AGE_HOURS" ]; then
                      echo "WARNING: Backup for $site_name is $age_hours hours old (latest: $backup_date)"
                  fi
              fi
          done
      dest: /usr/local/bin/freeflarum-backup/check-backups.sh
      owner: root
      group: root
      mode: "755"

- name: Set up backup monitoring cron job
  ansible.builtin.cron:
      name: "FreeFlarum backup monitoring"
      minute: "0"
      hour: "9"
      job: "/usr/local/bin/freeflarum-backup/check-backups.sh | mail -s 'FreeFlarum Backup Status' root"
      user: root
      state: present

- name: Create backup logrotate config
  ansible.builtin.copy:
      content: |
          /var/log/freeflarum-backup.log {
              daily
              rotate 30
              compress
              delaycompress
              missingok
              notifempty
              create 0644 root root
          }
      dest: /etc/logrotate.d/freeflarum-backup
      owner: root
      group: root
      mode: "644"
