---
- name: Configure UFW defaults
  ansible.builtin.copy:
      src: files/etc/default/ufw
      dest: /etc/default/ufw
      mode: "644"

- name: Configure UFW rules
  community.general.ufw:
      rule: allow
      port: "{{ item }}"
      proto: tcp
  loop: "{{ ufw_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
      state: enabled
      policy: deny
      direction: incoming

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
      src: files/etc/fail2ban/jail.local
      dest: /etc/fail2ban/jail.local
      mode: "0644"
  notify: restart fail2ban

- name: Create apparmor profiles directory
  ansible.builtin.file:
      path: /etc/apparmor.d/local
      state: directory
      mode: "0755"

- name: Configure AppArmor for PHP-FPM
  ansible.builtin.template:
      src: files/etc/apparmor.d/usr.sbin.php-fpm
      dest: "/etc/apparmor.d/usr.sbin.php-fpm{{ php_version }}"
      mode: "0644"
  notify: reload apparmor

# https://rkhunter.sourceforge.net/
- name: Set up rkhunter
  ansible.builtin.apt:
      name: rkhunter
      state: present

- name: Configure rkhunter
  ansible.builtin.lineinfile:
      path: files/etc/rkhunter.conf
      dest: /etc/rkhunter.conf
      mode: "644"

# https://aide.github.io/
- name: Set up AIDE (Advanced Intrusion Detection Environment)
  ansible.builtin.apt:
      name: aide
      state: present

- name: Initialize AIDE database
  ansible.builtin.command:
      cmd: aideinit
      creates: /var/lib/aide/aide.db
