---
- name: Configure UFW defaults
  ansible.builtin.copy:
      src: files/etc/default/ufw
      dest: /etc/default/ufw
      mode: "0644"
  tags: ["security"]

- name: Configure UFW rules
  community.general.ufw:
      rule: allow
      port: "{{ port }}"
      proto: tcp
  loop: "{{ ufw_allowed_ports }}"
  loop_control:
      loop_var: port
  tags: ["security"]

- name: Enable UFW
  community.general.ufw:
      state: enabled
      policy: deny
      direction: incoming
  tags: ["security"]

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
      src: files/etc/fail2ban/jail.local
      dest: /etc/fail2ban/jail.local
      mode: "0644"
  notify: restart fail2ban
  tags: ["security"]

- name: Install the weekly fail2ban report
  ansible.builtin.template:
      src: files/usr/local/bin/fail2ban-weekly-report
      dest: /usr/local/bin/fail2ban-weekly-report
      mode: "0755"
  tags: ["security"]

- name: Disallow SSH password logins
  ansible.builtin.copy:
      src: files/etc/ssh/sshd_config.d/10-key-only.conf
      dest: /etc/ssh/sshd_config.d/10-key-only.conf
      mode: "0644"
  notify: restart sshd
  tags: ["security", "ssh"]

# a broken sshd configuration fails the play here, before the handler restarts sshd
- name: Check the SSH server configuration
  ansible.builtin.command:
      cmd: /usr/sbin/sshd -t
  changed_when: false
  tags: ["security", "ssh"]

# https://rkhunter.sourceforge.net/
- name: Set up rkhunter
  ansible.builtin.apt:
      name: rkhunter
      state: present
  tags: ["security"]

- name: Configure rkhunter
  ansible.builtin.copy:
      src: files/etc/rkhunter.conf
      dest: /etc/rkhunter.conf
      mode: "0644"
  tags: ["security"]
