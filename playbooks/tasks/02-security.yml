---
- name: Configure UFW defaults
  ansible.builtin.copy:
      src: files/etc/default/ufw
      dest: /etc/default/ufw
      mode: "0644"
  tags: ["security"]

- name: Configure UFW rules
  community.general.ufw:
      rule: allow
      port: "{{ port }}"
      proto: tcp
  loop: "{{ ufw_allowed_ports }}"
  loop_control:
      loop_var: port
  tags: ["security"]

- name: Enable UFW
  community.general.ufw:
      state: enabled
      policy: deny
      direction: incoming
  tags: ["security"]

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
      src: files/etc/fail2ban/jail.local
      dest: /etc/fail2ban/jail.local
      mode: "0644"
  notify: restart fail2ban
  tags: ["security"]

- name: Install the weekly fail2ban report
  ansible.builtin.template:
      src: files/usr/local/bin/fail2ban-weekly-report
      dest: /usr/local/bin/fail2ban-weekly-report
      mode: "0755"
  tags: ["security"]

# https://rkhunter.sourceforge.net/
- name: Set up rkhunter
  ansible.builtin.apt:
      name: rkhunter
      state: present
  tags: ["security"]

- name: Configure rkhunter
  ansible.builtin.copy:
      src: files/etc/rkhunter.conf
      dest: /etc/rkhunter.conf
      mode: "0644"
  tags: ["security"]

# https://aide.github.io/
- name: Set up AIDE (Advanced Intrusion Detection Environment)
  ansible.builtin.apt:
      name: aide
      state: present
  tags: ["security"]

- name: Exclude variable data (tenants, backups, databases) from AIDE
  ansible.builtin.template:
      src: files/etc/aide/aide.conf.d/90_aide_hosting
      dest: /etc/aide/aide.conf.d/90_aide_hosting
      mode: "0644"
  register: _aide_rules
  tags: ["security"]

- name: Check AIDE database
  ansible.builtin.stat:
      path: /var/lib/aide/aide.db
  register: _aide_db
  tags: ["security"]

# the baseline must be built with the current rules: initialize again whenever they change
- name: Initialize AIDE database
  ansible.builtin.command:
      cmd: nice -n 19 ionice -c 3 aideinit --yes --force
  when: _aide_rules.changed or not _aide_db.stat.exists
  tags: ["security"]

- name: Enable the daily AIDE check
  ansible.builtin.systemd:
      name: dailyaidecheck.timer
      enabled: true
      state: started
  tags: ["security"]
